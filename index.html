  --bg0:#06051a;--bg1:#110b33;--bg2:#1f1250;--bar:rgba(6,5,26,.94);--panel:#15103c;
  --n1:138,108,255;--n2:255,122,196;--n3:78,150,255;
  --gold:#f3dcae;--gold-2:#d7b06a;--gold-rgb:243,220,174;--on-gold:#2b1c06;
  --ink:#f7f3ff;--ink-2:#cdc7ea;--ink-3:#958ebf;--heart:#ff7fb5;
  --glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.1);
  --line:rgba(var(--gold-rgb),.18);--line-2:rgba(var(--gold-rgb),.42);
  --ph-bg:linear-gradient(135deg,rgba(var(--n1),.26),rgba(var(--n2),.14));
  --serif:"Cormorant","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gut:20px;--rh:150px;--sh:214px}
[data-theme="avrora"]{--bg0:#03121a;--bg1:#06242d;--bg2:#0b3c41;--bar:rgba(3,18,26,.94);--panel:#082a33;--n1:64,224,190;--n2:120,140,255;--n3:170,255,150;--gold:#d8f8e8;--gold-2:#8fdcc0;--gold-rgb:216,248,232;--on-gold:#062a22;--ink-2:#c3e2dc;--ink-3:#84aeaa}
[data-theme="rassvet"]{--bg0:#16071c;--bg1:#2d0f34;--bg2:#4d1b42;--bar:rgba(22,7,28,.94);--panel:#2b1032;--n1:255,140,120;--n2:255,110,180;--n3:255,196,120;--gold:#ffe3c6;--gold-2:#f0b58a;--gold-rgb:255,227,198;--on-gold:#3a1606;--ink-2:#ecc9d6;--ink-3:#b58fa6}
[data-theme="okean"]{--bg0:#020a1c;--bg1:#061b3e;--bg2:#0b3162;--bar:rgba(2,10,28,.94);--panel:#07214c;--n1:70,150,255;--n2:90,230,255;--n3:130,120,255;--gold:#deedff;--gold-2:#9cc4f2;--gold-rgb:222,237,255;--on-gold:#06204a;--ink-2:#c2d4ee;--ink-3:#8499bd}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg0);overscroll-behavior:none}
body{color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
img{-webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg.i{width:1em;height:1em;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── небо ───────── */
#sky{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--bg0),var(--bg1) 52%,var(--bg2))}
#skyNeb{position:absolute;left:-6%;top:-6%;width:112%;height:112%;animation:nebDrift 80s ease-in-out infinite alternate}
#skyStars{position:absolute;inset:0;width:100%;height:100%}
#sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 28%,rgba(3,2,14,0) 42%,rgba(3,2,14,.5))}
@keyframes nebDrift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2.5%,2%,0) scale(1.08)}}
#sky .tw{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 7px 1px rgba(255,255,255,.75);opacity:.2;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
#sky .met{position:absolute;left:0;top:0;width:170px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));opacity:0;transform-origin:100% 50%}

/* ───────── экраны ───────── */
#app{position:fixed;inset:0;z-index:1;transition:opacity .45s ease}
.veil #app{opacity:0;pointer-events:none}
.screen{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:rgba(var(--gold-rgb),.25) transparent;
  opacity:0;visibility:hidden;transition:opacity .28s ease,transform .5s var(--ease),visibility 0s linear .5s}
.screen::-webkit-scrollbar{width:6px}.screen::-webkit-scrollbar-thumb{background:rgba(var(--gold-rgb),.22);border-radius:3px}
@media (hover:none){.screen{scrollbar-width:none}.screen::-webkit-scrollbar{display:none}}
#gate{transform:scale(1.04)}
#home{transform:scale(.975)}
#album{transform:translate3d(0,26px,0)}
#app[data-screen="gate"] #gate,#app[data-screen="home"] #home,#app[data-screen="album"] #album{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease .1s,transform .7s var(--ease) .08s,visibility 0s}
.wrap{max-width:720px;margin:0 auto;padding-left:max(var(--gut),var(--sal));padding-right:max(var(--gut),var(--sar))}
.wrap.wide{max-width:1180px}

/* общие мелочи */
.eyebrow{font:500 11px/1.25 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 28px;border-radius:27px;font:500 14px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;transition:transform .2s var(--ease),opacity .2s,box-shadow .3s,background .3s}
.btn:active{transform:scale(.97)}
.btn.gold{color:var(--on-gold);background:linear-gradient(135deg,#fff,var(--gold) 38%,var(--gold-2));box-shadow:0 12px 34px -10px rgba(var(--gold-rgb),.6),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.ghost{color:var(--gold);border:1px solid var(--line-2);background:rgba(var(--gold-rgb),.06)}
.btn.wide{width:100%}
.btn.sm{height:42px;padding:0 20px;border-radius:21px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{font-size:18px}
.ib{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink);border:1px solid var(--line);background:var(--glass);transition:transform .2s var(--ease),background .25s,border-color .25s,color .25s}
.ib:active{transform:scale(.9);background:var(--glass-2)}
.ib.sm{width:38px;height:38px;font-size:17px}
.tb{flex:none;height:40px;padding:0 16px;border-radius:20px;font:500 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line-2);background:rgba(var(--gold-rgb),.07);transition:transform .2s var(--ease),background .25s}
.tb:active{transform:scale(.95)}
/* тонкая золотая рамка-градиент на прозрачной карточке */
.gb{position:relative}
.gb::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(var(--gold-rgb),.75),rgba(var(--gold-rgb),.1) 34%,rgba(var(--n2),.12) 66%,rgba(var(--n2),.65));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.ph-img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s ease}
.ph-img.on{opacity:1}

/* ───────── вход ───────── */
.gate{display:grid;place-items:center;padding:calc(var(--sat) + 24px) 26px calc(var(--sab) + 24px)}
.gate-in{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;text-align:center}
.emblem{width:176px;height:176px;margin-bottom:10px;overflow:visible}
.emblem .moon{filter:drop-shadow(0 0 22px rgba(var(--gold-rgb),.55))}
.emblem .sp{animation:tw 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.emblem .sp.b{animation-duration:4.8s;animation-delay:-1.4s}.emblem .sp.c{animation-duration:5.6s;animation-delay:-2.8s}
.gate-t{font:600 clamp(50px,14.5vw,66px)/1 var(--serif);letter-spacing:-.012em;padding-bottom:.08em;background:linear-gradient(180deg,#fff 30%,var(--gold) 115%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.gate-s{margin-top:12px;font:400 12px/1.4 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.gate-f{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:14px}
.fld{position:relative;display:block}
.fld input{width:100%;height:56px;padding:0 54px 0 24px;border-radius:28px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--ink);font:400 17px/1 var(--sans);letter-spacing:.06em;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .25s,box-shadow .25s,background .25s}
.fld input::placeholder{color:var(--ink-3);letter-spacing:.1em}
.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.14);background:rgba(255,255,255,.08)}
.fld button{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink-3)}
.chk{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:6px;font:400 13.5px/1.2 var(--sans);color:var(--ink-2);cursor:pointer}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk i{flex:none;width:20px;height:20px;border-radius:6px;border:1px solid var(--line-2);display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk input:checked+i{background:var(--gold);border-color:var(--gold)}
.chk input:checked+i::after{content:"";width:10px;height:6px;border:solid var(--on-gold);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.chk input:focus-visible+i{outline:2px solid var(--gold);outline-offset:3px}
.gate-e{color:#ffb3c7;font:400 14px/1.4 var(--sans)}
.gate-f.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.gate-f.busy .btn{opacity:.6;pointer-events:none}
.gate-w{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:20px;color:var(--ink-2);font:400 13px/1.4 var(--sans);letter-spacing:.14em}
.loader{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);animation:spin 1.7s linear infinite}
.loader::after{content:"";position:absolute;left:50%;top:-4px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── главная: шапка и «я сейчас» ───────── */
.hbar{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 14px) 0 4px}
.brand{display:inline-flex;align-items:center;gap:10px;font:500 11.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.brand svg{width:13px;height:13px;fill:currentColor;stroke:none}
.hbar .sp{flex:1}
.bars{display:flex;align-items:flex-end;gap:2.5px;height:15px}
.bars i{width:2.5px;height:100%;border-radius:2px;background:currentColor;transform-origin:50% 100%;transform:scaleY(.2);opacity:.5;transition:transform .4s,opacity .4s}
.eq[aria-pressed="true"]{color:var(--gold);border-color:var(--line-2)}
.eq[aria-pressed="true"] .bars i{opacity:1;animation:eq 1.15s ease-in-out infinite}
.eq[aria-pressed="true"] .bars i:nth-child(2){animation-duration:.85s;animation-delay:-.3s}
.eq[aria-pressed="true"] .bars i:nth-child(3){animation-duration:1.35s;animation-delay:-.6s}
.eq[aria-pressed="true"] .bars i:nth-child(4){animation-duration:1s;animation-delay:-.15s}
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 0 0}
.ava{position:relative;width:150px;height:150px;display:grid;place-items:center;margin:22px 0 34px;border-radius:50%;transition:transform .35s var(--ease)}
.ava:active{transform:scale(.96)}
.ava-orb{position:absolute;left:-42px;top:-42px;width:234px;height:234px;pointer-events:none;overflow:visible;color:var(--gold)}
.ava-ph{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 26%,rgba(var(--n1),.9),rgba(var(--n1),.25) 62%,rgba(10,8,40,.9));
  box-shadow:0 0 0 1px rgba(var(--gold-rgb),.75),0 0 0 7px rgba(6,5,26,.55),0 0 0 8px rgba(var(--gold-rgb),.26),0 0 70px rgba(var(--n1),.6)}
.ava-ph::after,.pl-ph::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.2),rgba(255,255,255,0) 40%),radial-gradient(circle at 76% 90%,rgba(4,2,24,.38),rgba(4,2,24,0) 52%)}
.hero-age{margin-top:12px;font:600 clamp(56px,16.5vw,88px)/.96 var(--serif);letter-spacing:-.018em;font-variant-numeric:lining-nums;padding-bottom:.1em;background:linear-gradient(180deg,#fff 34%,var(--gold) 118%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero-sub{margin-top:6px;font:400 17px/1.3 var(--sans);letter-spacing:.03em;color:var(--ink-2)}
.orn{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0 12px;color:var(--gold)}
.orn i{width:60px;height:1px;background:linear-gradient(90deg,rgba(var(--gold-rgb),0),var(--line-2))}
.orn i:last-child{transform:scaleX(-1)}
.orn svg{width:12px;height:12px;fill:currentColor;stroke:none}
.fact{display:grid;place-items:center;min-height:48px;max-width:32ch;padding:0 6px;font:400 15.5px/1.42 var(--sans);color:var(--ink-2);text-wrap:balance}
.fact span{grid-area:1/1;transition:opacity .5s ease,transform .6s var(--ease)}
.fact span.out{opacity:0;transform:translateY(-8px)}
.fact span.in{opacity:0;transform:translateY(8px)}
.fact b{font-weight:500;color:var(--ink)}

/* ───────── аффирмация ───────── */
.aff{margin:30px 0 0;padding:18px 18px 16px 22px;border-radius:30px;overflow:hidden;background:linear-gradient(155deg,rgba(var(--n1),.22),rgba(var(--n2),.09) 58%,rgba(255,255,255,.03))}
.aff-deco{position:absolute;right:-46px;top:-46px;width:190px;height:190px;color:var(--gold);opacity:.16;pointer-events:none}
.aff-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.aff-stage{position:relative;display:grid;place-items:center;width:100%;min-height:158px;padding:14px 2px 18px;text-align:center}
.aff-t{grid-area:1/1;font:500 italic clamp(28px,7.9vw,40px)/1.13 var(--serif);color:var(--ink);text-wrap:balance}
.aff-t span{display:inline-block;animation:wordIn .9s var(--ease) both;animation-delay:calc(var(--k)*65ms + 120ms)}
.aff-t.out{animation:fadeOut .3s ease both}
@keyframes wordIn{from{opacity:0;transform:translate3d(0,.55em,0)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0;transform:translate3d(0,-.3em,0)}}
.aff-bot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:4px;font:400 12px/1 var(--sans);letter-spacing:.08em;color:var(--ink-3)}

/* ───────── три кнопки ───────── */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.acts button{display:flex;flex-direction:column;align-items:center;gap:11px;padding:18px 6px 15px;border-radius:24px;background:var(--glass);border:1px solid var(--line);text-align:center;transition:transform .2s var(--ease),background .25s}
.acts button:active{transform:scale(.955);background:var(--glass-2)}
.act-i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--gold);border:1px solid var(--line-2);background:radial-gradient(circle at 30% 24%,rgba(var(--gold-rgb),.24),rgba(var(--gold-rgb),0) 72%)}
.acts b{font:500 12.5px/1.22 var(--sans);letter-spacing:.02em;color:var(--ink)}
/* ───────── вход в «Мою планету» (mir.html): открытка мира; подпись — в пустом небе слева, остров и луна справа не закрыты ───────── */
.mir{position:relative;display:block;margin:12px 0 0;border-radius:28px;overflow:hidden;isolation:isolate;aspect-ratio:16/9;background:#140c38;color:#f7f3ff;text-decoration:none;box-shadow:0 18px 44px -18px rgba(0,0,0,.85);transition:transform .25s var(--ease)}
.mir:active{transform:scale(.98)}
.mir img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:mirDrift 30s ease-in-out infinite alternate}
@keyframes mirDrift{from{transform:scale(1.01)}to{transform:scale(1.09) translate3d(-1.6%,-1%,0)}}
.mir::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.36);
  background:linear-gradient(90deg,rgba(8,5,30,.8),rgba(8,5,30,.44) 34%,rgba(8,5,30,0) 60%),linear-gradient(0deg,rgba(8,5,30,.5),rgba(8,5,30,0) 42%)}
.mir-t{position:absolute;z-index:1;left:20px;bottom:17px;width:46%;display:block}
.mir-t i,.mir-t b,.mir-t em{display:block}
.mir-t i{white-space:nowrap}
.mir-t b{margin-top:7px;font:600 clamp(30px,8.2vw,52px)/.98 var(--serif);letter-spacing:-.012em;text-shadow:0 2px 18px rgba(8,5,30,.7)}
.mir-t em{margin-top:8px;font:normal 400 13.5px/1.32 var(--sans);color:#d6cff0;text-wrap:balance}
.mir-go{position:absolute;z-index:1;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--on-gold);background:linear-gradient(135deg,#fff,var(--gold) 40%,var(--gold-2));box-shadow:0 10px 26px -8px rgba(var(--gold-rgb),.7)}
@media (max-width:359px){.mir-t{left:16px;bottom:14px;width:47%}.mir-t em{font-size:12.5px}.mir-go{width:40px;height:40px;font-size:19px;right:12px;bottom:12px}}
@media (min-width:640px){.mir-t{left:28px;bottom:26px}.mir-t em{font-size:15.5px}.mir-go{width:56px;height:56px;font-size:25px;right:24px;bottom:24px}}

/* ───────── разделы главной, ленты ───────── */
.sec{margin:46px 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 16px}
.sec-h h2{margin-top:7px;font:600 33px/1.02 var(--serif);letter-spacing:-.01em}
.sec-s{margin-top:7px;font:400 14px/1.4 var(--sans);letter-spacing:.02em;color:var(--ink-3)}
.more{flex:none;display:inline-flex;align-items:center;gap:4px;padding:12px 0 5px 12px;font:500 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.more svg{font-size:14px}
.strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;margin:0 calc(-1*var(--gut));padding:4px var(--gut) 12px;scroll-snap-type:x proximity;scroll-padding-left:var(--gut);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;height:var(--sh);aspect-ratio:var(--ar);border-radius:20px;overflow:hidden;background:var(--ph-bg);scroll-snap-align:start;box-shadow:0 0 0 1px rgba(var(--gold-rgb),.18),0 16px 30px -16px rgba(0,0,0,.8);transition:transform .25s var(--ease)}
.card:active{transform:scale(.97)}
.empty{display:flex;align-items:center;gap:18px;padding:20px 22px;border-radius:24px;border:1px dashed var(--line-2);color:var(--ink-2);font:400 15px/1.45 var(--sans)}
.empty svg{flex:none;width:58px;height:58px;color:var(--heart)}
.empty b{display:block;margin-bottom:3px;font:600 21px/1.1 var(--serif);color:var(--ink)}

/* ───────── моя вселенная: путь по месяцам ───────── */
.chap{margin:38px 0 0}
.chap-h{text-align:center}
.moons{display:inline-flex;align-items:center;gap:8px;color:var(--gold)}
.moons svg{width:74px;height:14px;overflow:visible}
.chap-h h3{margin-top:10px;font:600 italic 31px/1 var(--serif)}
.chap-h p{margin-top:9px;font:400 13px/1.3 var(--sans);letter-spacing:.05em;color:var(--ink-3)}
.orbit{position:relative;list-style:none;margin:6px 0 0;padding:0}
.orbit-line{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.orbit-line path{fill:none;stroke:rgba(var(--gold-rgb),.62);stroke-width:1.7;stroke-dasharray:.1 6.5;stroke-linecap:round}
.orbit.plain .orbit-line{display:none}
.stop{position:relative;display:flex;align-items:center;gap:20px;height:158px;--d:120px}
.stop.r{flex-direction:row-reverse;text-align:right}
.stop.c{flex-direction:column;justify-content:center;gap:16px;height:auto;padding:30px 0 6px;text-align:center;--d:150px}
.stop.c.s{--d:112px}
.stop-t{flex:1;min-width:0}
.stop.c .stop-t{flex:none}
.stop-t b{display:block;font:600 28px/1 var(--serif);letter-spacing:-.006em}
.stop-t span{display:block;margin-top:8px;font:400 13px/1.25 var(--sans);letter-spacing:.06em;color:var(--ink-2)}
.stop-t i{display:block;margin-top:4px;font:normal 400 12.5px/1.25 var(--sans);letter-spacing:.06em;color:var(--ink-3)}
.planet{position:relative;flex:none;width:var(--d);height:var(--d);margin:0 4px;border-radius:50%;isolation:isolate;transition:transform .35s var(--ease)}
.planet:active{transform:scale(.94)}
.pl-ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 32% 26%,hsl(var(--h) 72% 66%),hsl(var(--h) 58% 30%) 58%,hsl(var(--h) 60% 13%));
  box-shadow:0 0 0 1px rgba(var(--gold-rgb),.6),0 0 0 6px rgba(6,5,26,.55),0 0 0 7px rgba(var(--gold-rgb),.2),0 16px 44px -8px hsla(var(--h),85%,62%,.6)}
.planet.ring::before{content:"";position:absolute;left:-17%;right:-17%;top:37%;height:26%;border:1px solid rgba(var(--gold-rgb),.55);border-radius:50%;transform:rotate(-17deg);z-index:-1}
.planet.moon::before{content:"";position:absolute;right:-9%;top:4%;width:13%;height:13%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 55%,var(--gold-2));box-shadow:0 0 12px rgba(var(--gold-rgb),.7)}
.planet.now .pl-ph{box-shadow:0 0 0 1px rgba(var(--gold-rgb),.8),0 0 0 7px rgba(6,5,26,.55),0 0 0 8px rgba(var(--gold-rgb),.3),0 0 80px rgba(var(--n2),.6)}
.planet.now::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(var(--gold-rgb),.35);animation:halo 3.6s ease-out infinite;pointer-events:none}
@keyframes halo{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.22);opacity:0}}
.planet.lock .pl-ph{display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(var(--n1),.5),rgba(var(--n1),.12) 60%,rgba(8,6,30,.9));color:var(--gold);font-size:34px}
.planet.lock .pl-ph svg{position:relative;z-index:1}
.planet.lock::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px dashed rgba(var(--gold-rgb),.5);animation:spin 40s linear infinite;pointer-events:none}
.dust{display:flex;justify-content:center;align-items:center;gap:0}
.dust .planet{--d:74px;margin:0 -9px}
.dust .planet:nth-child(2){--d:92px;z-index:1}

.foot{margin:60px 0 0;padding:28px 0 calc(var(--sab) + 34px);text-align:center;border-top:1px solid var(--line);color:var(--ink-3);font:400 12.5px/1.6 var(--sans);letter-spacing:.08em}
.foot svg{display:inline-block;width:12px;height:12px;margin-bottom:10px;fill:var(--gold);stroke:none}
#home .rise{opacity:0}
#home.enter .rise{animation:rise 1s var(--ease) both;animation-delay:calc(var(--i,0)*85ms + 150ms)}
#home.seen .rise{opacity:1}
@keyframes rise{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:none}}

/* ───────── альбом ───────── */
.abar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 10px) max(12px,var(--sar)) 16px max(12px,var(--sal));background:linear-gradient(var(--bar) 30%,rgba(0,0,0,0));pointer-events:none}
.abar>*{pointer-events:auto}
.abar-t{flex:1;min-width:0;text-align:center;font:600 21px/1.1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .35s var(--ease)}
#album.scrolled .abar-t,.selecting .abar-t{opacity:1;transform:none}
.abar .hole{flex:none;width:44px}
.al-h{padding:4px 0 6px;text-align:center}
.al-h h1{margin-top:10px;font:600 clamp(42px,12vw,68px)/.98 var(--serif);letter-spacing:-.014em;padding-bottom:.06em;text-wrap:balance}
.al-s{margin-top:10px;font:400 14px/1.45 var(--sans);letter-spacing:.04em;color:var(--ink-2)}
.al-note{margin:22px auto 0;max-width:36ch;text-align:center;color:var(--ink-3);font:400 14px/1.5 var(--sans)}
.day{margin:32px 0 0}
.day-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 10px;margin:0 2px 11px}
.day-h h3{font:600 24px/1.05 var(--serif);font-variant-numeric:lining-nums}
.day-w{font:400 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.day-tag{padding:4px 9px 3px;border-radius:10px;font:500 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--on-gold);background:var(--gold)}
.day-a{flex-basis:100%;font:400 13px/1.25 var(--sans);letter-spacing:.03em;color:var(--ink-3)}
.day-sel{display:none;margin-left:auto;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:6px 0 6px 10px}
.selecting .day-sel{display:block}
.grid{display:flex;flex-wrap:wrap;gap:4px}
.grid::after{content:"";flex-grow:1000000000}
.cell{position:relative;flex-grow:calc(var(--ar)*100);flex-basis:calc(var(--ar)*var(--rh));aspect-ratio:var(--ar);min-width:0;border-radius:10px;overflow:hidden;background:var(--ph-bg);transition:transform .22s var(--ease)}
.cell:active{transform:scale(.965)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.07);transition:opacity .55s ease,transform 1s var(--ease)}
.cell img.on{opacity:1;transform:none}
.cell .hf{position:absolute;left:7px;bottom:7px;width:15px;height:15px;color:var(--heart);display:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.65))}
.cell .hf svg{width:100%;height:100%;fill:currentColor;stroke:none}
.cell.fav .hf{display:block}
.cell .ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:1.5px solid #fff;background:rgba(0,0,0,.28);display:none;place-items:center;color:transparent;font-size:14px}
.selecting .cell .ck{display:grid}
.cell.sel{background:rgba(var(--gold-rgb),.3)}
.cell.sel img{transform:scale(.88);border-radius:8px}
.cell.sel .ck{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.cell.sel .ck svg{stroke-width:2.6}
.al-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:46px 0 0}
.al-nav button{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px 12px 12px;border-radius:22px;border:1px solid var(--line);background:var(--glass);text-align:left;transition:transform .2s var(--ease),background .25s}
.al-nav button:active{transform:scale(.97);background:var(--glass-2)}
.al-nav button.nx{grid-column:2;flex-direction:row-reverse;text-align:right;padding:12px 12px 12px 14px}
.al-nav .mini{flex:none;width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--ph-bg);box-shadow:0 0 0 1px var(--line-2)}
.al-nav span{min-width:0}
.al-nav small{display:block;font:500 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.al-nav b{display:block;margin-top:6px;font:600 19px/1.08 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-end{height:calc(var(--sab) + 44px)}
.selecting .al-end{height:calc(var(--sab) + 110px)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px max(16px,var(--sar)) calc(var(--sab) + 12px) max(16px,var(--sal));background:var(--panel);border-top:1px solid var(--line-2);transform:translateY(110%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s}
.selecting .selbar{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.selbar b{flex:1;font:500 14px/1.2 var(--sans);letter-spacing:.04em}

/* ───────── просмотр фото ───────── */
#viewer{position:fixed;inset:0;z-index:50;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:contain}
.v-bg{position:absolute;inset:0;background:#04030f}
.v-track{position:absolute;inset:0;will-change:transform}
.v-slide{position:absolute;left:0;top:0;width:100%;height:100%}
.v-img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.v-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 10px) max(12px,var(--sar)) 30px max(12px,var(--sal));background:linear-gradient(rgba(4,3,15,.78),rgba(4,3,15,0));transition:opacity .28s,transform .4s var(--ease)}
.v-cap{flex:1;min-width:0;text-align:center}
.v-cap b{display:block;font:600 22px/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-cap span{display:block;margin-top:5px;font:400 12px/1.2 var(--sans);letter-spacing:.08em;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-bot{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:14px;padding:34px 16px calc(var(--sab) + 18px);background:linear-gradient(rgba(4,3,15,0),rgba(4,3,15,.8));transition:opacity .28s,transform .4s var(--ease)}
#viewer.noui .v-top{opacity:0;transform:translateY(-14px);pointer-events:none}
#viewer.noui .v-bot{opacity:0;transform:translateY(14px);pointer-events:none}
#viewer.noui .v-nav{opacity:0;pointer-events:none}
.vb{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:23px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);transition:transform .2s var(--ease),background .2s,color .2s,border-color .2s}
.vb:active{transform:scale(.88)}
.vb.sm{width:44px;height:44px;font-size:20px}
.vb.heart.on{color:var(--heart);background:rgba(255,127,181,.16);border-color:rgba(255,127,181,.55)}
.vb.heart.on svg{fill:currentColor}
.vb.red{color:#ff8f8f}
.v-n{flex:none;min-width:44px;text-align:center;font:400 12px/1 var(--sans);letter-spacing:.08em;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.v-nav{position:absolute;top:50%;z-index:3;margin-top:-26px;transition:opacity .28s}
.v-nav.p{left:18px}.v-nav.n{right:18px}
@media (hover:none){.v-nav{display:none}}
.v-pop{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;color:var(--heart);pointer-events:none;opacity:0;z-index:4}
.v-pop svg{width:100%;height:100%;fill:currentColor;stroke:none;filter:drop-shadow(0 8px 26px rgba(255,80,150,.65))}
.v-wait{position:absolute;left:50%;top:50%;z-index:2;margin:-23px 0 0 -23px;opacity:0;transition:opacity .3s .5s;pointer-events:none}
.v-wait.on{opacity:1}

/* ───────── фильм «Как я росла» ───────── */
#film{position:fixed;inset:0;z-index:60;background:#03020c;overflow:hidden;-webkit-user-select:none;user-select:none}
.f-frame{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.f-frame.on{opacity:1}
.f-blur{position:absolute;inset:-10%;background:center/cover no-repeat;filter:blur(28px) brightness(.5) saturate(1.25)}
.f-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;will-change:transform}
.f-frame.on .f-img,.f-frame.was .f-img{animation:kb var(--dur,6s) linear both}
#film.paused .f-img{animation-play-state:paused}
@keyframes kb{from{transform:scale(1.01) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(var(--kx,0),var(--ky,0),0)}}
.f-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(3,2,12,.62),rgba(3,2,12,0) 22%,rgba(3,2,12,0) 58%,rgba(3,2,12,.86))}
.f-top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 14px) max(16px,var(--sar)) 0 max(16px,var(--sal))}
.f-prog{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.f-prog i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--gold-2),#fff);transform-origin:0 50%;transform:scaleX(0);transition:transform .6s linear}
.f-cap{position:absolute;left:max(24px,var(--sal));right:max(24px,var(--sar));bottom:calc(var(--sab) + 34px);z-index:3;pointer-events:none}
.f-cap b{display:block;font:600 italic clamp(34px,9.6vw,54px)/1 var(--serif);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.f-cap span{display:block;margin-top:9px;font:400 12.5px/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.f-cap.go b,.f-cap.go span{animation:wordIn .9s var(--ease) both}
.f-cap.go span{animation-delay:.12s}
.f-mid{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none}
.f-mid .vb{opacity:0;transform:scale(.8);transition:opacity .3s,transform .4s var(--ease);width:76px;height:76px;font-size:32px;background:rgba(4,3,15,.45)}
#film.paused .f-mid .vb{opacity:1;transform:none}
.f-end{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 42%,rgba(var(--n1),.3),rgba(var(--n1),0) 70%),rgba(4,3,15,.9);opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.f-end.on{opacity:1;visibility:visible;transition:opacity 1s ease,visibility 0s}
.f-end h2{font:600 clamp(40px,11vw,62px)/1 var(--serif);text-wrap:balance}
.f-end p:not(.eyebrow){max-width:22ch;font:500 italic 24px/1.2 var(--serif);color:var(--ink-2);text-wrap:balance}
.f-end .row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}

/* ───────── минута для себя ───────── */
#calm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,rgba(var(--n1),.2),rgba(4,3,15,.5) 78%);-webkit-user-select:none;user-select:none}
.c-ring{position:absolute;left:50%;top:50%;width:min(80vw,62vh,380px);aspect-ratio:1;margin:calc(min(80vw,62vh,380px)/-2) 0 0 calc(min(80vw,62vh,380px)/-2);border-radius:50%;border:1px solid var(--line-2);box-shadow:0 0 90px rgba(var(--n1),.35),inset 0 0 70px rgba(var(--n2),.14);animation:breath 10s ease-in-out infinite}
.c-ring.b{border-color:rgba(var(--gold-rgb),.16);box-shadow:none;animation-name:breathB}
@keyframes breath{0%,100%{transform:scale(.8);opacity:.5}42%,58%{transform:scale(1.08);opacity:1}}
@keyframes breathB{0%,100%{transform:scale(.94);opacity:.3}42%,58%{transform:scale(1.26);opacity:.75}}
.c-stage{position:relative;display:grid;place-items:center;width:min(72vw,330px);min-height:200px;text-align:center}
.c-t{grid-area:1/1;font:500 italic clamp(29px,8.4vw,44px)/1.13 var(--serif);text-wrap:balance}
.c-t span{display:inline-block;animation:wordIn 1.1s var(--ease) both;animation-delay:calc(var(--k)*80ms + 200ms)}
.c-t.out{animation:fadeOut .45s ease both}
.c-top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) max(14px,var(--sar)) 0 max(14px,var(--sal))}
.c-dots{flex:1;display:flex;justify-content:center;gap:9px;color:var(--gold)}
.c-dots svg{width:11px;height:11px;fill:currentColor;stroke:none;opacity:.22;transform:scale(.8);transition:opacity .6s,transform .6s var(--ease)}
.c-dots svg.on{opacity:1;transform:none}
.c-br{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 54px);text-align:center;font:400 11.5px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.c-end{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 34px);display:flex;justify-content:center;gap:10px}

/* ───────── игра «Созвездия» ───────── */
#game{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,rgba(var(--n1),.2),rgba(4,3,15,.55) 78%);-webkit-user-select:none;user-select:none;touch-action:manipulation}
.g-top{position:relative;z-index:5;width:100%;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) max(14px,var(--sar)) 0 max(14px,var(--sal))}   /* выше слоя с вступлением: иначе крестик под ним не нажимается */
.g-slots{flex:1;display:flex;justify-content:center;gap:10px}
.g-slots i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);font-size:13px;transition:background .5s,border-color .5s,box-shadow .5s}
.g-slots i svg{fill:currentColor;stroke:none;opacity:.25;transition:opacity .5s}
.g-slots i.on{border-color:var(--gold);background:rgba(var(--gold-rgb),.14);box-shadow:0 0 18px rgba(var(--gold-rgb),.45)}
.g-slots i.on svg{opacity:1}
.g-head{margin-top:20px;padding:0 24px;text-align:center}
.g-head h2{margin-top:8px;font:600 italic clamp(36px,10vw,50px)/1 var(--serif)}
.g-field{position:relative;flex:none;width:min(88vw,54vh,440px);aspect-ratio:1;margin:auto 0}
.g-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.g-lines line{stroke:var(--gold);stroke-width:.55;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 0 2px rgba(var(--gold-rgb),.9))}
.g-lines line.ghost{stroke-width:.3;opacity:.16;stroke-dasharray:.3 1.6;filter:none}
.g-star{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;display:grid;place-items:center;border-radius:50%;color:#fff}
.g-star svg{width:22px;height:22px;fill:currentColor;stroke:none;opacity:.5;transform:scale(.72);transition:transform .35s var(--ease),opacity .35s,color .35s,filter .35s}
.g-star.dim svg{opacity:.34}
.g-star.lit svg{opacity:1;transform:scale(1.5);color:var(--gold);filter:drop-shadow(0 0 12px rgba(var(--gold-rgb),1))}
.g-star.got svg{opacity:1;transform:scale(1.05);color:var(--gold);filter:drop-shadow(0 0 6px rgba(var(--gold-rgb),.8))}
.g-field.shake{animation:shake .45s}
.g-field.win .g-star.got svg{animation:starWin 1.2s var(--ease)}
@keyframes starWin{35%{transform:scale(1.9)}100%{transform:scale(1.05)}}
.g-msg{min-height:26px;padding:0 24px;text-align:center;font:400 13px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.g-bot{display:flex;justify-content:center;gap:10px;padding:18px 20px calc(var(--sab) + 26px)}
.g-intro{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
#game.intro>:not(.g-intro):not(.g-top){visibility:hidden}
.g-intro .planet{--d:132px;margin-bottom:10px}
.g-intro h2{font:600 clamp(38px,10.5vw,56px)/1 var(--serif);text-wrap:balance}
.g-intro p:not(.eyebrow){max-width:27ch;color:var(--ink-2);font:400 16px/1.5 var(--sans);text-wrap:balance}
.g-intro .btn{margin-top:10px}

/* ───────── листы снизу, подсказки ───────── */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(3,2,12,.62);opacity:0;transition:opacity .32s}
.sheet-box{position:relative;width:min(100%,520px);max-height:90%;overflow-y:auto;overscroll-behavior:contain;padding:10px 22px calc(var(--sab) + 24px);border-radius:30px 30px 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(104%);transition:transform .46s var(--ease)}
.sheet-box::before{content:"";display:block;width:40px;height:4px;margin:0 auto 18px;border-radius:2px;background:rgba(255,255,255,.2)}
.sheet.on .sheet-bg{opacity:1}
.sheet.on .sheet-box{transform:none}
@media (min-width:700px){.sheet{align-items:center}.sheet-box{border-radius:30px;border-bottom:1px solid var(--line);padding-bottom:26px}}
.sh-t{font:600 30px/1.05 var(--serif);text-align:center}
.sh-p{margin-top:10px;text-align:center;color:var(--ink-2);font:400 15px/1.5 var(--sans)}
.sh-row{display:flex;gap:10px;margin-top:22px}
.sh-row .btn{flex:1;padding:0 12px}
.sh-form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.sh-err{color:#ffb3c7;text-align:center;font:400 14px/1.4 var(--sans)}
.set-h{margin:26px 0 12px;font:500 11px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.set-h:first-of-type{margin-top:18px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 2px 10px;border-radius:18px;border:1px solid transparent;font:400 12.5px/1 var(--sans);color:var(--ink-2);transition:background .25s,border-color .25s}
.themes button[aria-pressed="true"]{border-color:var(--line-2);background:var(--glass);color:var(--ink)}
.themes i{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.25),inset 0 0 0 3px rgba(0,0,0,.25)}
.themes [data-th="noch"] i{background:radial-gradient(circle at 30% 25%,#f3dcae,#8a6cff 45%,#110b33)}
.themes [data-th="avrora"] i{background:radial-gradient(circle at 30% 25%,#d8f8e8,#40e0be 45%,#06242d)}
.themes [data-th="rassvet"] i{background:radial-gradient(circle at 30% 25%,#ffe3c6,#ff6eb4 45%,#2d0f34)}
.themes [data-th="okean"] i{background:radial-gradient(circle at 30% 25%,#deedff,#4696ff 45%,#061b3e)}
.rows{border-radius:20px;border:1px solid var(--line);overflow:hidden}
.rows>*{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:10px 16px;text-align:left;font:400 15.5px/1.3 var(--sans);color:var(--ink)}
.rows>*+*{border-top:1px solid var(--line)}
.rows button:active{background:var(--glass-2)}
.rows svg{font-size:20px;color:var(--gold)}
.rows span{flex:1;min-width:0}
.rows small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3)}
.rows em{font-style:normal;font-size:13px;color:var(--ink-3)}
.sw{flex:none;position:relative;width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.14);transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
[aria-checked="true"] .sw{background:var(--gold-2)}
[aria-checked="true"] .sw::after{transform:translateX(18px)}
.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tracks button{height:44px;border-radius:14px;border:1px solid var(--line);font:400 14px/1 var(--sans);color:var(--ink-2);transition:background .25s,border-color .25s,color .25s}
.tracks button[aria-pressed="true"]{border-color:var(--gold);background:rgba(var(--gold-rgb),.12);color:var(--gold)}
.set-foot{margin-top:22px;text-align:center;font:400 12px/1.5 var(--sans);letter-spacing:.06em;color:var(--ink-3)}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 24px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 14px;pointer-events:none;transition:transform .4s var(--ease)}
.selecting #toasts{transform:translateY(-72px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;max-width:min(100%,460px);padding:13px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 14px 40px rgba(0,0,0,.55);font:400 14.5px/1.4 var(--sans);animation:toastIn .5s var(--ease) both}
.toast.out{animation:toastOut .35s ease both}
.toast button{flex:none;font:500 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:8px 0 8px 4px}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translate3d(0,10px,0)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:95;pointer-events:none}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(var(--n1),.5) 30%,rgba(var(--n1),0) 70%);opacity:0}

/* ───────── планшет и компьютер ───────── */
@media (min-width:640px){:root{--gut:28px;--rh:170px;--sh:250px}}
@media (min-width:1000px){:root{--rh:215px;--sh:280px}
  .stop{height:176px;--d:136px}.stop-t b{font-size:32px}.cell{border-radius:12px}.grid{gap:6px}}
@media (max-width:359px){:root{--gut:16px;--rh:132px}.stop{--d:104px;gap:14px}.stop-t b{font-size:25px}.acts b{font-size:11.5px}}
@media (max-height:520px) and (orientation:landscape){.f-cap b{font-size:30px}.g-head{margin-top:6px}.g-head h2{font-size:28px}.g-field{width:min(54vh,60vw)}.g-bot{padding-top:6px;padding-bottom:calc(var(--sab) + 10px)}}

@media (prefers-reduced-motion:reduce){
  #skyNeb,#sky .tw,.emblem .sp,.planet.now::after,.planet.lock::after,.c-ring,.eq[aria-pressed="true"] .bars i,.mir img{animation:none}
  .aff-t span,.c-t span,#home.enter .rise,.f-frame.on .f-img,.f-frame.was .f-img{animation-duration:.01s;animation-delay:0s}
  .screen,.cell img,.sheet-box{transition-duration:.01s}
}
</style>
</head>

<div id="sky" aria-hidden="true"><canvas id="skyNeb"></canvas><canvas id="skyStars"></canvas></div>

<div id="app" data-screen="gate">

  <!-- ═════ вход ═════ -->
  <section id="gate" class="screen gate">
    <div class="gate-in">
      <svg class="emblem" viewBox="0 0 176 176" aria-hidden="true">
        <defs>
          <linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" style="stop-color:var(--gold)"/><stop offset="1" style="stop-color:var(--gold-2)"/></linearGradient>
          <mask id="mMoon"><rect width="176" height="176" fill="#000"/><circle cx="88" cy="88" r="41" fill="#fff"/><circle cx="105" cy="76" r="36" fill="#000"/></mask>
        </defs>
        <g fill="none" style="stroke:var(--gold)">
          <ellipse cx="88" cy="88" rx="80" ry="27" transform="rotate(-24 88 88)" stroke-width=".8" opacity=".6"/>
          <circle cx="88" cy="88" r="66" stroke-width="1" stroke-dasharray=".1 6" stroke-linecap="round" opacity=".5"/>
        </g>
        <g class="moon"><rect width="176" height="176" fill="url(#gMoon)" mask="url(#mMoon)"/></g>
        <g transform="rotate(-24 88 88)"><circle r="3.200" fill="#fff"><animateMotion dur="16s" repeatCount="indefinite" path="M168,88 A80,27 0 1 1 8,88 A80,27 0 1 1 168,88"/></circle></g>
        <g style="color:var(--gold)">
          <use class="sp" href="#i-spark" x="124" y="30" width="18" height="18"/>
          <use class="sp b" href="#i-spark" x="26" y="116" width="11" height="11"/>
          <use class="sp c" href="#i-spark" x="112" y="104" width="8" height="8"/>
        </g>
      </svg>
      <h1 class="gate-t">Мой космос</h1>
      <p class="gate-s">здесь живут мои воспоминания</p>
      <form id="gateF" class="gate-f" autocomplete="off" hidden>
        <label class="fld"><span class="sr">Кодовое слово</span><input id="gateP" type="password" name="kod" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="кодовое слово" enterkeyhint="go"><button type="button" id="gateEye" aria-label="Показать кодовое слово"><svg class="i" viewBox="0 0 24 24"><use href="#i-eye"/></svg></button></label>
        <button class="btn gold wide" type="submit" id="gateGo">Войти</button>
        <label class="chk"><input type="checkbox" id="gateR" checked><i></i><span>запомнить меня на этом устройстве</span></label>
        <p class="gate-e" id="gateE" role="alert" hidden></p>
      </form>
      <div class="gate-w" id="gateW" hidden><i class="loader"></i><p id="gateWT">Открываю мой космос…</p><button class="btn ghost sm" id="gateRetry" type="button" hidden>Попробовать снова</button></div>
    </div>
  </section>

  <!-- ═════ главная ═════ -->
  <main id="home" class="screen">
    <div class="wrap">
      <header class="hbar rise">
        <span class="brand"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg>Мой космос</span><span class="sp"></span>
        <button class="ib eq" id="bMusic" type="button" aria-label="Музыка" aria-pressed="false"><span class="bars"><i></i><i></i><i></i><i></i></span></button>
        <button class="ib" id="bMenu" type="button" aria-label="Настройки"><svg class="i" viewBox="0 0 24 24"><use href="#i-tune"/></svg></button>
      </header>

      <section class="hero">
        <button class="ava rise" id="heroAva" type="button" style="--i:1" aria-label="Мои фото сейчас">
          <svg class="ava-orb" viewBox="0 0 234 234" aria-hidden="true">
            <g fill="none" stroke="currentColor">
              <ellipse cx="117" cy="117" rx="113" ry="37" transform="rotate(-20 117 117)" stroke-width=".8" opacity=".65"/>
              <circle cx="117" cy="117" r="99" stroke-width="1" stroke-dasharray=".1 7" stroke-linecap="round" opacity=".5"/>
            </g>
            <g transform="rotate(-20 117 117)"><circle r="3.400" fill="#fff"><animateMotion dur="18s" repeatCount="indefinite" path="M230,117 A113,37 0 1 1 4,117 A113,37 0 1 1 230,117"/></circle></g>
            <use href="#i-spark" x="197" y="26" width="16" height="16"/>
            <use href="#i-spark" x="12" y="172" width="10" height="10"/>
          </svg>
          <span class="ava-ph" id="heroPh"></span>
        </button>
        <p class="eyebrow rise" id="heroHi" style="--i:2"></p>
        <h1 class="hero-age rise" id="heroAge" style="--i:3"></h1>
        <p class="hero-sub rise" id="heroSub" style="--i:4"></p>
        <div class="orn rise" style="--i:5" aria-hidden="true"><i></i><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg><i></i></div>
        <button class="fact rise" id="heroFact" type="button" style="--i:5" aria-label="Ещё один факт обо мне"></button>
      </section>

      <section class="aff gb rise" id="aff" style="--i:6" aria-label="Моя аффирмация">
        <svg class="aff-deco" viewBox="0 0 190 190" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="95" cy="95" r="94"/><circle cx="95" cy="95" r="68" stroke-dasharray=".1 6" stroke-linecap="round"/><circle cx="95" cy="95" r="42"/><use href="#i-spark" x="20" y="124" width="22" height="22"/></svg>
        <div class="aff-top"><span class="eyebrow">моя аффирмация</span><button class="ib sm" id="affBig" type="button" aria-label="Минута для себя: аффирмации на весь экран"><svg class="i" viewBox="0 0 24 24"><use href="#i-expand"/></svg></button></div>
        <button class="aff-stage" id="affStage" type="button" aria-label="Следующая аффирмация"></button>
        <div class="aff-bot"><span>нажми — появится следующая</span><span id="affN"></span></div>
      </section>

      <nav class="acts rise" style="--i:7" aria-label="Что посмотреть">
        <button type="button" id="aRandom"><span class="act-i"><svg class="i" viewBox="0 0 24 24"><use href="#i-dice"/></svg></span><b>Случайное<br>фото</b></button>
        <button type="button" id="aFilm"><span class="act-i"><svg class="i" viewBox="0 0 24 24"><use href="#i-play"/></svg></span><b>Как я<br>росла</b></button>
        <button type="button" id="aCalm"><span class="act-i"><svg class="i" viewBox="0 0 24 24"><use href="#i-calm"/></svg></span><b>Минута<br>для себя</b></button>
      </nav>

      <!-- вход в «Мою планету» — мир из кубиков (страница mir.html; её части — site/mir_src, сборка site/mir_make.py).
           Открытка assets/mir/planeta.webp снята так, что слева пустое небо, остров и луна справа: подпись стоит в левой половине.

      <a class="mir rise" id="mirCard" href="mir.html" style="--i:8" aria-label="Моя планета — мой мир из кубиков. Войти">

        <span class="mir-t"><i class="eyebrow">мир из кубиков</i><b>Моя<br>планета</b><em>остров, башня до Луны и мои фото</em></span>
        <span class="mir-go" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><use href="#i-fwd"/></svg></span>
      </a>

      <div id="todayBox"></div>

      <section class="sec" id="favSec">
        <header class="sec-h"><div><p class="eyebrow">моё созвездие</p><h2>Любимые</h2></div><button class="more" id="favMore" type="button" hidden></button></header>
        <div id="favBox"></div>
      </section>

      <section class="sec" id="pathSec">
        <header class="sec-h"><div><p class="eyebrow">моя вселенная</p><h2>Месяц за месяцем</h2><p class="sec-s" id="pathS"></p></div></header>
        <div id="pathBox"></div>
      </section>

      <footer class="foot"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg><div id="footT"></div></footer>
    </div>
  </main>

  <!-- ═════ альбом ═════ -->
  <section id="album" class="screen" aria-label="Альбом">
    <header class="abar">
      <button class="ib" id="alBack" type="button" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <div class="abar-t" id="alBarT"></div>
      <button class="tb" id="alSel" type="button" hidden>Выбрать</button><span class="hole" id="alHole"></span>
    </header>
    <div class="wrap wide">
      <div class="al-h"><p class="eyebrow" id="alEy"></p><h1 id="alT"></h1><p class="al-s" id="alS"></p></div>
      <div id="alBody"></div>
      <nav class="al-nav" id="alNav" aria-label="Соседние месяцы"></nav>
      <div class="al-end"></div>
    </div>
  </section>
</div>

<div class="selbar" id="selbar"><button class="tb" id="selX" type="button">Отмена</button><b id="selN"></b><button class="btn gold sm" id="selDo" type="button" disabled>Удалить</button></div>

<!-- ═════ просмотр фото ═════ -->

  <div class="v-bg" id="vBg"></div>
  <div class="v-track" id="vTrack"></div>
  <i class="loader v-wait" id="vWait"></i>
  <div class="v-pop" id="vPop"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></div>
  <header class="v-top">
    <button class="vb sm" id="vClose" type="button" aria-label="Закрыть"><svg class="i" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    <div class="v-cap"><b id="vT"></b><span id="vS"></span></div>
    <span class="v-n" id="vN"></span>
  </header>
  <footer class="v-bot">
    <button class="vb sm red" id="vDel" type="button" aria-label="Удалить фото" hidden><svg class="i" viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
    <button class="vb sm" id="vMain" type="button" aria-label="Поставить это фото на главную"><svg class="i" viewBox="0 0 24 24"><use href="#i-star"/></svg></button>
    <button class="vb heart" id="vHeart" type="button" aria-label="Любимое фото" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><use href="#i-heart"/></svg></button>
    <button class="vb sm" id="vShare" type="button" aria-label="Сохранить или поделиться"><svg class="i" viewBox="0 0 24 24"><use href="#i-share"/></svg></button>

<script>
(() => {
"use strict";
/* ══════ 00_util.js ══════ */
/* «Мой космос», версия 2. Мелкие помощники: страница, память устройства, числа, русские слова и даты. */
const D = document;
const $ = (s, r = D) => r.querySelector(s);
const $$ = (s, r = D) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e = D.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const ico = (id, cls) => `<svg class="i${cls ? " " + cls : ""}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => r()));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TOUCH = matchMedia("(hover: none)").matches;
const BUILD = "20261112-1110";

/* память устройства: не падает в приватном режиме и при переполнении */
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  json(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  put(k, v) { this.set(k, JSON.stringify(v)); }
};

/* случайности, которые повторяются: один и тот же день — один и тот же порядок */
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const shuffle = (a, r = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const dayNo = () => { const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset() * 6e4) / 864e5); };
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* русские слова */
const nf = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const pl = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const tY = y => y + " " + pl(y, "год", "года", "лет");
const tM = m => m + " " + pl(m, "месяц", "месяца", "месяцев");
const tD = d => d + " " + pl(d, "день", "дня", "дней");
const tF = n => nf(n) + " фото";
const MON = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONG = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const MONP = ["январе", "феврале", "марте", "апреле", "мае", "июне", "июле", "августе", "сентябре", "октябре", "ноябре", "декабре"];
const WDAY = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
const ORD = ["первый", "второй", "третий", "четвёртый", "пятый", "шестой", "седьмой", "восьмой", "девятый", "десятый", "одиннадцатый", "двенадцатый", "тринадцатый", "четырнадцатый", "пятнадцатый", "шестнадцатый", "семнадцатый", "восемнадцатый", "девятнадцатый", "двадцатый"];
const parseD = s => { const a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2] || 1); };

/* возраст: всё от первого лица — «мне 3 месяца» */
let BIRTH = new Date(2014, 1, 9);
function ageAt(date) {
  let y = date.getFullYear() - BIRTH.getFullYear(), m = date.getMonth() - BIRTH.getMonth(), d = date.getDate() - BIRTH.getDate();
  if (d < 0) { m--; d += new Date(date.getFullYear(), date.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const days = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - BIRTH) / 864e5);
  return { y, m, d, days };
}
function monthTitle(m, short) {             // m — сколько полных месяцев: «Мне 3 месяца» / «3 месяца»
  if (m <= 0) return short ? "Первый месяц" : "Мой первый месяц";
  const y = Math.floor(m / 12), r = m % 12;
  const s = y === 0 ? tM(r) : m === 12 ? "годик" : tY(y) + (r ? " " + tM(r) : "");
  return short ? cap(s) : "Мне " + s;
}
function ageText(date) {                     // точный возраст в день съёмки
  const a = ageAt(date);
  if (a.days <= 0) return "день, когда я родилась";
  if (a.y === 0 && a.m === 0) return "мне " + tD(a.days);
  if (a.y === 0) return "мне " + tM(a.m) + (a.d ? " и " + tD(a.d) : "");
  return "мне " + (a.y === 1 && !a.m ? "годик" : tY(a.y) + (a.m ? " " + tM(a.m) : "")) + (a.d ? " и " + tD(a.d) : "");
}
const nowYears = () => ageAt(new Date()).y;

/* ══════ 10_data.js ══════ */
/* Шифрование и загрузка. Всё, что лежит на сайте про фото, зашифровано AES-256-GCM; ключ получается из кодового слова
   (PBKDF2-SHA256). Файл = 12 байт iv + шифротекст. Формат прежний (lock.json, data/m.bin, data/del.bin, data/f|t/*.bin). */
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const PHOTO_BASE = LOCAL ? "data/" : "https://raw.githubusercontent.com/asty7us-web/moy-kosmos/main/data/";
let KEY = null, LOCK = null, G = null;

class NetErr extends Error {}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
/* кодовое слово понимается в любой раскладке и регистре, пробелы и дефисы не важны */
const KB_RU = "йцукенгшщзхъфывапролджэячсмитьбю", KB_EN = "qwertyuiop[]asdfghjkl;'zxcvbnm,.";
const normPw = s => Array.from(String(s).toLowerCase().replace(/ё/g, "е"), c => { const i = KB_RU.indexOf(c); return i < 0 ? c : KB_EN[i]; }).join("").replace(/[^0-9a-z]/g, "");

async function getBin(url, opt) {
  let r;
  try { r = await fetch(url, opt); } catch (e) { throw new NetErr("net"); }
  if (!r.ok) { const e = new NetErr("http" + r.status); e.status = r.status; throw e; }
  try { return await r.arrayBuffer(); } catch (e) { throw new NetErr("net"); }
}
async function aesDec(buf, key) { const b = new Uint8Array(buf); return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, key || KEY, b.subarray(12)); }
async function aesEnc(bytes, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
const decJson = async (buf, key) => JSON.parse(new TextDecoder().decode(await aesDec(buf, key)));
async function deriveKey(pass, saltB64, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPw(pass)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(saltB64), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
const importKey = rawB64 => crypto.subtle.importKey("raw", b64d(rawB64), "AES-GCM", true, ["encrypt", "decrypt"]);
const exportKey = async key => b64e(await crypto.subtle.exportKey("raw", key));

async function fetchLock() {
  for (let a = 0; a < 3; a++) {
    try { const r = await fetch("lock.json?v=" + Date.now(), { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) {}
    await wait(900);
  }
  throw new NetErr("net");
}
async function fetchDel(key) {            // общий список удалённых; файла может не быть
  try { return (await decJson(await getBin("data/del.bin?v=" + Date.now(), { cache: "no-store" }), key)).del || []; } catch (e) { return null; }
}
/* открыть космос ключом: проверка ключа → список альбомов → список удалённых */
async function openWith(key) {
  let ok = "";
  try { ok = new TextDecoder().decode(await aesDec(b64d(LOCK.chk), key)); } catch (e) { throw new Error("bad"); }
  if (ok !== "kosmos-ok") throw new Error("bad");
  const g = await decJson(await getBin("data/m.bin?v=" + encodeURIComponent(LOCK.b || "0")), key);
  g.del = (await fetchDel(key)) || [];
  KEY = key; G = g;
}

/* ───── фото: скачать, расшифровать, отдать адрес картинки в памяти ───── */
const Ph = (() => {
  const urls = new Map();                 // "t/c0010" → Promise<blob-адрес>
  const big = [];                         // большие фото держим только последние: память телефона не резиновая
  const BIG_MAX = 12;
  function one(k) {
    const u = PHOTO_BASE + k + ".bin";
    // не расшифровалось — значит, файл на сайте заменили, а в памяти телефона старый: берём свежий
    return getBin(u).then(b => aesDec(b)).catch(e => { if (e instanceof NetErr) throw e; return getBin(u + "?fresh=1", { cache: "reload" }).then(b => aesDec(b)); })
      .then(b => URL.createObjectURL(new Blob([b], { type: "image/jpeg" })));
  }
  function get(n, isBig) {
    const k = (isBig ? "f/" : "t/") + n; let p = urls.get(k);
    if (!p) { p = one(k); urls.set(k, p); p.catch(() => { if (urls.get(k) === p) urls.delete(k); }); }
    if (isBig) {
      const i = big.indexOf(k); if (i >= 0) big.splice(i, 1); big.push(k);
      while (big.length > BIG_MAX) { const old = big.shift(), op = urls.get(old); urls.delete(old); if (op) op.then(u => setTimeout(() => URL.revokeObjectURL(u), 4000)).catch(() => {}); }
    }
    return p;
  }
  const has = (n, isBig) => urls.has((isBig ? "f/" : "t/") + n);
  /* готовая к показу картинка: адрес получен и кадр декодирован */
  function ready(n, isBig) { return get(n, isBig).then(u => { const im = new Image(); im.src = u; return (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => u); }); }
  async function file(n) { const u = await get(n, true), b = await (await fetch(u)).blob(); return new File([b], fileName(n), { type: "image/jpeg" }); }
  const fileName = n => { const p = G && G.ph[n]; return "moy-kosmos" + (p && p.d ? "-" + p.d : "") + "-" + n + ".jpg"; };
  return { get, has, ready, file, fileName };
})();

/* ───── ленивая загрузка миниатюр: не больше шести сразу, первыми — те, что только что попали на экран ───── */
const Lazy = (() => {
  const MAX = 6, pend = [], info = new WeakMap(), roots = new Map(); let active = 0;
  function pump() {
    while (active < MAX && pend.length) {
      const im = pend.pop(), w = info.get(im);
      if (!w || w.go || !im.isConnected) continue;
      w.go = 1; active++;
      Ph.get(w.n, w.big).then(u => show(im, w, u), () => fail(im, w)).then(() => { active--; pump(); });
    }
  }
  function show(im, w, u) {
    if (w.o) w.o.unobserve(im);
    const done = () => { im.classList.add("on"); if (w.cb) w.cb(im); };
    im.src = u;
    if (im.decode) im.decode().then(done, done); else im.onload = done;
  }
  function fail(im, w) {
    w.go = 0; w.tries = (w.tries || 0) + 1;
    if (w.tries < 4) setTimeout(() => { if (im.isConnected && !w.go && w.near) { pend.push(im); pump(); } }, 2500 * w.tries);
  }
  function watch(root) {
    return new IntersectionObserver(es => {
      for (const e of es) {
        const im = e.target, w = info.get(im); if (!w) continue; w.near = e.isIntersecting; if (w.go) continue;
        const i = pend.indexOf(im); if (i >= 0) pend.splice(i, 1);
        if (e.isIntersecting) pend.push(im);
      }
      pump();
    }, { root: root || null, rootMargin: "800px 0px 800px 0px" });
  }
  /* img(имя, прокручиваемый экран, большое?, что сделать после показа) */
  function img(n, root, isBig, cb) {
    const im = new Image(); im.alt = ""; im.decoding = "async"; im.draggable = false; im.className = "ph-img";
    let o = roots.get(root || D); if (!o) { o = watch(root); roots.set(root || D, o); }
    info.set(im, { n, big: !!isBig, go: 0, o, cb }); o.observe(im);
    return im;
  }
  /* сразу, без ожидания прокрутки (обложки, аватар) */
  function now(n, isBig, cb) {
    const im = new Image(); im.alt = ""; im.decoding = "async"; im.draggable = false; im.className = "ph-img";
    Ph.get(n, isBig).then(u => { im.src = u; const done = () => { im.classList.add("on"); if (cb) cb(im); }; if (im.decode) im.decode().then(done, done); else im.onload = done; }, () => {});
    return im;
  }
  return { img, now };
})();

/* ══════ 20_sky.js ══════ */
/* Небо: туманности и звёзды рисуются один раз (не каждый кадр) — телефон не греется; живость дают мерцающие точки и метеоры. */
const THEMES = [["noch", "Полночь"], ["avrora", "Аврора"], ["rassvet", "Рассвет"], ["okean", "Океан"]];
const Sky = (() => {
  const box = $("#sky"), neb = $("#skyNeb"), st = $("#skyStars"); let W = 0, H = 0, rt = 0;
  const cssv = v => getComputedStyle(D.documentElement).getPropertyValue(v).trim();
  function drawNeb() {
    const w = neb.width = 120, h = neb.height = Math.max(60, Math.round(120 * H / Math.max(1, W))), g = neb.getContext("2d");
    g.clearRect(0, 0, w, h); g.globalCompositeOperation = "lighter";
    const blob = (x, y, r, rgb, a) => {
      const R = r * Math.max(w, h), gr = g.createRadialGradient(x * w, y * h, 0, x * w, y * h, R);
      gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(.45, `rgba(${rgb},${a * .42})`); gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    };
    const n1 = cssv("--n1"), n2 = cssv("--n2"), n3 = cssv("--n3");
    blob(.06, .05, .5, n1, .34); blob(1, .27, .36, n2, .2); blob(.16, .6, .38, n3, .13); blob(.96, .84, .5, n1, .24); blob(0, 1, .34, n2, .13);
  }
  function drawStars() {
    const dpr = Math.min(2, window.devicePixelRatio || 1); st.width = Math.round(W * dpr); st.height = Math.round(H * dpr);
    const g = st.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = rng(20140209), n = Math.round(W * H / 2300);
    for (let i = 0; i < n; i++) {
      const x = r() * W, y = r() * H, z = r(), rad = z < .86 ? .3 + r() * .55 : z < .985 ? .85 + r() * .55 : 1.45 + r() * .6, a = .22 + r() * .72, t = r();
      const col = t < .14 ? "255,228,194" : t < .3 ? "198,210,255" : "255,255,255";
      g.fillStyle = `rgba(${col},${a})`; g.beginPath(); g.arc(x, y, rad, 0, 6.2832); g.fill();
      if (rad > 1.45) {                       // у самых ярких — лучики и ореол
        const gl = g.createRadialGradient(x, y, 0, x, y, rad * 7); gl.addColorStop(0, `rgba(${col},.32)`); gl.addColorStop(1, `rgba(${col},0)`);
        g.fillStyle = gl; g.beginPath(); g.arc(x, y, rad * 7, 0, 6.2832); g.fill();
        g.strokeStyle = `rgba(${col},.55)`; g.lineWidth = .6; g.beginPath(); g.moveTo(x - rad * 5, y); g.lineTo(x + rad * 5, y); g.moveTo(x, y - rad * 5); g.lineTo(x, y + rad * 5); g.stroke();
      }
    }
  }
  function size(force) {
    const w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
    if (!force && Math.abs(w - W) < 2 && Math.abs(h - H) < 90) return;   // клавиатура и адресная строка небо не перерисовывают
    W = w; H = h; drawNeb(); drawStars();
  }
  function meteor() {
    if (D.hidden || RM) return;
    const m = el("i", "met"), a = 148 + Math.random() * 20, len = 240 + Math.random() * 260, x = W * (.25 + Math.random() * .85), y = H * Math.random() * .42;
    const dx = Math.cos(a * Math.PI / 180) * len, dy = Math.sin(a * Math.PI / 180) * len;
    box.append(m);
    m.animate([{ opacity: 0, transform: `translate(${x - 170}px,${y}px) rotate(${a}deg) scaleX(.2)` }, { opacity: 1, offset: .22 }, { opacity: 0, transform: `translate(${x - 170 + dx}px,${y + dy}px) rotate(${a}deg) scaleX(1)` }],
      { duration: 1100 + Math.random() * 700, easing: "cubic-bezier(.3,.1,.6,1)" }).onfinish = () => m.remove();
  }
  function init() {
    size(true);
    const r = rng(77); let s = "";
    for (let k = 0; k < (RM ? 0 : 22); k++) s += `<i class="tw" style="left:${(r() * 100).toFixed(1)}%;top:${(r() * 100).toFixed(1)}%;--s:${(1.4 + r() * 2.2).toFixed(1)}px;--d:${(2.6 + r() * 4.4).toFixed(1)}s;--dl:${(-r() * 7).toFixed(1)}s"></i>`;
    box.insertAdjacentHTML("beforeend", s);
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(size, 220); });
    setTimeout(meteor, 3200);
    (function loop() { setTimeout(() => { meteor(); loop(); }, 6500 + Math.random() * 7000); })();
  }
  function theme(t, save) {

    D.documentElement.setAttribute("data-theme", t); if (save) LS.set("mk2.theme", t);
    const mc = $('meta[name="theme-color"]'); if (mc) mc.content = cssv("--bg0") || "#06051a";
