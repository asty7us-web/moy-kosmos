  return { init, theme, current, meteor };
})();

/* звёздная вспышка: любимое фото, победа в игре, день рождения */
function starBurst(x, y, n = 26) {
  if (RM) return;
  const c = $("#fx"), g = c.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.hidden = false; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(D.documentElement), cols = [cs.getPropertyValue("--gold").trim() || "#f3dcae", "#ffffff", cs.getPropertyValue("--heart").trim() || "#ff7fb5"];
  const P = Array.from({ length: n }, (_, i) => { const a = Math.random() * 6.2832, v = 2.2 + Math.random() * 6.5; return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.6, r: 2 + Math.random() * 5.5, c: cols[i % 3], s: Math.random() * 6.28, l: 1 }; });
  const star = (px, py, r, rot) => { g.beginPath(); for (let k = 0; k < 8; k++) { const rr = k % 2 ? r * .34 : r, a = rot + k * Math.PI / 4; g.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); } g.closePath(); g.fill(); };
  let last = performance.now();
  (function tick(t) {
    const k = Math.min(3, (t - last) / 16.7); last = t; g.clearRect(0, 0, W, H); let alive = 0;
    for (const p of P) { p.x += p.vx * k; p.y += p.vy * k; p.vy += .12 * k; p.vx *= Math.pow(.985, k); p.l -= .013 * k; p.s += .08 * k; if (p.l <= 0) continue; alive++; g.globalAlpha = Math.min(1, p.l * 1.6); g.fillStyle = p.c; star(p.x, p.y, p.r * (.6 + p.l * .4), p.s); }
    g.globalAlpha = 1;
    if (alive) requestAnimationFrame(tick); else { g.clearRect(0, 0, W, H); c.hidden = true; }
  })(last);
}

/* ══════ 30_audio.js ══════ */
/* Музыка: четыре мелодии по кругу, идут потоком (не ждут полной загрузки). Включается с первого касания, если её не выключили;
   выбор помнится. Громкость мягкая и нарастает плавно — через WebAudio, потому что на iPhone громкость у <audio> не меняется. */
const TRACKS = [["assets/space-music.mp3", "1"], ["assets/space-music-2.mp3", "2"], ["assets/space-music-3.mp3", "3"], ["assets/space-music-4.mp3", "4"]];
const Music = (() => {
  const VOL = .36; let ctx = null, gain = null, au = null, on = false, sw = 0;
  let want = LS.get("mk2.music", LS.get("spMute", "0") === "1" ? "0" : "1") === "1";      // прежний выбор «без звука» уважаем
  let ti = (parseInt(LS.get("mk2.track", LS.get("spTrack", "0")), 10) || 0) % TRACKS.length;
  const subs = new Set(), emit = () => subs.forEach(f => f());
  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    try {
      ctx = new AC(); gain = ctx.createGain(); gain.gain.value = 0.0001; gain.connect(ctx.destination);
      au = new Audio(); au.preload = "none"; ctx.createMediaElementSource(au).connect(gain);
      au.addEventListener("ended", () => { if (on) track(ti + 1, true); });
    } catch (e) { ctx = null; return false; }
    return true;
  }
  function ramp(to, s) { const t = ctx.currentTime, g = gain.gain; try { g.cancelScheduledValues(t); g.setValueAtTime(Math.max(g.value, 0.0001), t); g.exponentialRampToValueAtTime(Math.max(to, 0.0001), t + s); } catch (e) {} }
  function start(fade) {
    if (!ensure()) return;
    if (ctx.state !== "running") ctx.resume().catch(() => {});
    if (!au.getAttribute("src")) au.src = TRACKS[ti][0];
    const p = au.play(); if (p && p.catch) p.catch(() => {});
    ramp(VOL, fade || 2.6); on = true; emit();
  }
  function stop() {
    on = false; emit(); if (!ctx) return;
    ramp(0, .6); const k = ++sw; setTimeout(() => { if (!on && k === sw) au.pause(); }, 720);
  }
  function toggle() { want = !on; LS.set("mk2.music", want ? "1" : "0"); if (want) start(1.2); else stop(); return want; }
  function track(i, auto) {
    ti = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length; LS.set("mk2.track", String(ti)); emit();
    if (!ctx) { if (!auto) { want = true; LS.set("mk2.music", "1"); start(1.2); } return; }
    const k = ++sw; ramp(0, .45);
    setTimeout(() => { if (k !== sw) return; au.src = TRACKS[ti][0]; if (on || !auto) { want = true; LS.set("mk2.music", "1"); const p = au.play(); if (p && p.catch) p.catch(() => {}); ramp(VOL, 1.6); on = true; emit(); } }, 480);
  }
  /* первое касание где угодно: браузер разрешает звук только после него */
  function kick() {
    if (!want) return;
    if (!ctx) { start(); return; }
    if (!on || D.hidden) return;             // на iPhone звук может не пойти с первой попытки — добиваемся следующим касанием
    if (ctx.state !== "running") ctx.resume().catch(() => {});
    if (au.paused) { const p = au.play(); if (p && p.catch) p.catch(() => {}); }
  }
  D.addEventListener("visibilitychange", () => {
    if (!ctx || !on) return;
    if (D.hidden) au.pause(); else { if (ctx.state !== "running") ctx.resume().catch(() => {}); const p = au.play(); if (p && p.catch) p.catch(() => {}); }
  });
  /* короткие ноты для игры и мелких радостей — тем же выключателем звука */
  function tone(freq, dur = .32, vol = .2, type = "sine", when = 0) {
    if (!want || !ensure()) return; if (ctx.state !== "running") ctx.resume().catch(() => {});
    try {
      const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + .05);
    } catch (e) {}
  }
  return { kick, toggle, track, tone, on: () => on, want: () => want, index: () => ti, sub: f => subs.add(f) };
})();
["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(k => D.addEventListener(k, () => Music.kick(), { capture: true, passive: true }));

/* ══════ 40_model.js ══════ */
/* Модель: из расшифрованного списка (G) собираются месяцы жизни, любимые, удалённые, обложки, «в этот день». */
const M = { months: [], albums: [], byId: new Map(), order: [], pos: new Map(), albumOf: new Map(), hidden: new Set(), secret: null };
const P = n => G.ph[n];
const addMonths = (d, k) => new Date(d.getFullYear(), d.getMonth() + k, d.getDate());
const monthIdx = p => { const a = ageAt(parseD(p.d)); return Math.max(0, a.y * 12 + a.m); };   // сколько мне полных месяцев на фото

function buildModel() {
  BIRTH = parseD(G.birth || "2014-02-09");
  const secs = G.sections || [], dated = [], extra = [];
  for (const s of secs) { if (/^m\d+$/.test(s.id)) for (const n of s.p) { if (P(n) && P(n).d) dated.push(n); } else extra.push(s); }
  /* месяцы считаю по календарю от дня рождения: «мне 3 месяца» начинается ровно 9-го числа */
  const byM = new Map();
  for (const n of dated) { const m = monthIdx(P(n)); if (!byM.has(m)) byM.set(m, []); byM.get(m).push(n); }
  M.months = [...byM.keys()].sort((a, b) => a - b).map(m => ({ id: "m" + m, kind: "month", m, all: byM.get(m), title: monthTitle(m), short: monthTitle(m, true) }));
  const now = extra.find(s => s.id === "now"), nd = extra.find(s => s.id === "nd");
  M.now = { id: "now", kind: "now", all: now ? now.p.filter(P) : [], title: "Сейчас", short: "Сейчас" };
  M.nd = { id: "nd", kind: "nd", all: nd ? nd.p.filter(P) : [], title: "Без даты", short: "Без даты" };
  M.secret = { id: "secret", kind: "secret", all: (G.surprise || []).filter(P), title: "Мы с Ульяной", short: "Тайная планета" };
  M.albums = [...M.months, M.now, M.nd, M.secret];
  M.byId = new Map(M.albums.map(a => [a.id, a]));
  M.order = []; M.albumOf = new Map();
  for (const a of M.albums) for (const n of a.all) if (!M.albumOf.has(n)) { M.albumOf.set(n, a.id); M.order.push(n); }
  M.pos = new Map(M.order.map((n, i) => [n, i]));
  Del.calc(); Fav.load();
}
const visible = n => !M.hidden.has(n);
/* что показывать в альбоме (без удалённых) */
function listOf(id) {
  if (id === "fav") return Fav.list();
  if (id === "trash") return M.order.filter(n => M.hidden.has(n));
  const a = M.byId.get(id); return a ? a.all.filter(visible) : [];
}
const countOf = id => listOf(id).length;
const totalVisible = () => M.order.filter(n => visible(n) && (Secret.open() || M.albumOf.get(n) !== "secret")).length;

/* подписи к фото */
function photoWhen(n) {                         // { t: «Мне 3 месяца», s: «8 мая 2014, 14:35» }
  const p = P(n), a = M.albumOf.get(n);
  if (!p || !p.d) return a === "nd" ? { t: "Без даты", s: "когда снято — тайна" } : a === "secret" ? { t: "Мы с Ульяной", s: "тайная планета" } : { t: "Сейчас", s: "фото последних лет" };
  const d = parseD(p.d), t = monthTitle(monthIdx(p));
  if (p.ap === 0) return { t, s: `${d.getDate()} ${MONG[d.getMonth()]} ${d.getFullYear()}` + (p.tm ? ", " + p.tm : "") };
  return { t, s: (p.ap === 1 ? "≈ " : "") + MON[d.getMonth()] + " " + d.getFullYear() };
}
/* группы внутри альбома: сначала точные дни по порядку, потом фото, у которых известен только месяц */
function groupsOf(id) {
  const list = listOf(id), a = M.byId.get(id);
  if (!a || a.kind !== "month") {
    if (id === "fav") {                         // любимые — по возрасту
      const out = []; let cur = null;
      for (const n of list) { const k = M.albumOf.get(n), al = M.byId.get(k); if (!cur || cur.key !== k) out.push(cur = { key: k, h: al ? (al.kind === "month" ? al.title : al.title) : "", items: [] }); cur.items.push(n); }
      return out;
    }
    return list.length ? [{ key: id, items: list }] : [];
  }
  const days = [], loose = new Map();
  for (const n of list) {
    const p = P(n);
    if (p.ap === 0) { const k = p.d + (p.al || ""); let g = days[days.length - 1]; if (!g || g.key !== k) days.push(g = { key: k, date: parseD(p.d), tag: p.al || "", items: [] }); g.items.push(n); }
    else { const k = p.d.slice(0, 7) + (p.ap === 1 ? "~" : ""); if (!loose.has(k)) loose.set(k, { key: k, month: parseD(p.d.slice(0, 7) + "-01"), approx: p.ap === 1, items: [] }); loose.get(k).items.push(n); }
  }
  return [...days, ...[...loose.values()].sort((x, y) => x.month - y.month || (x.approx ? 1 : -1))];
}
function periodOf(a) {                          // «9 мая – 8 июня 2014»
  const s = addMonths(BIRTH, a.m), e = new Date(addMonths(BIRTH, a.m + 1) - 864e5);
  return `${s.getDate()} ${MONG[s.getMonth()]}${s.getFullYear() !== e.getFullYear() ? " " + s.getFullYear() : ""} – ${e.getDate()} ${MONG[e.getMonth()]} ${e.getFullYear()}`;
}
function monthSpan(a) {                         // коротко для подписи планеты: «май – июнь 2014»
  const s = addMonths(BIRTH, a.m), e = new Date(addMonths(BIRTH, a.m + 1) - 864e5);
  return s.getMonth() === e.getMonth() ? `${MON[s.getMonth()]} ${s.getFullYear()}` : `${MON[s.getMonth()]}${s.getFullYear() !== e.getFullYear() ? " " + s.getFullYear() : ""} – ${MON[e.getMonth()]} ${e.getFullYear()}`;
}

/* обложка: выбранная заранее (лежит в зашифрованном списке) или подходящее фото из середины месяца */
/* «куда смотреть» в фото (центр лиц, посчитан заранее) — чтобы кружок не обрезал лицо */
function focusOf(n) { const f = G.focus && G.focus[n]; return f ? { n, x: f[0], y: f[1] } : { n, x: 50, y: P(n) && P(n).h >= P(n).w ? 30 : 50 }; }
function coverOf(id) {
  const list = listOf(id); if (!list.length) return null;
  const c = G.cover && G.cover[id];
  if (c && list.includes(c)) return focusOf(c);
  const known = list.filter(n => G.focus && G.focus[n] && P(n).ap === 0), pool = known.length ? known : list;
  return focusOf(pool[Math.floor(pool.length * .4)]);
}
function avatar() {
  const mine = LS.get("mk2.ava", "");
  if (mine && P(mine) && visible(mine)) return focusOf(mine);
  const c = G.cover && G.cover.ava;
  if (c && P(c) && visible(c)) return focusOf(c);
  return coverOf("now") || coverOf(M.months.length ? M.months[M.months.length - 1].id : "nd");
}

/* ───── любимые: только то, что отметила сама; хранятся на этом устройстве ───── */
const Fav = (() => {
  let set = new Set(); const subs = new Set();
  function load() {
    let a = LS.json("mk2.fav", null);
    if (!Array.isArray(a)) { const old = LS.json("doch.fav2", {}); a = old && Array.isArray(old.add) ? old.add : []; LS.put("mk2.fav", a); }   // сердечки, поставленные раньше, сохраняю
    set = new Set(a.filter(n => P(n)));
  }
  const has = n => set.has(n);
  function toggle(n, to) { const v = to == null ? !set.has(n) : to; if (v === set.has(n)) return v; if (v) set.add(n); else set.delete(n); LS.put("mk2.fav", [...set]); subs.forEach(f => f(n, v)); return v; }
  const list = () => M.order.filter(n => set.has(n) && visible(n));            // по возрасту
  const recent = () => [...set].filter(n => P(n) && visible(n)).reverse();      // последние отмеченные — первыми
  return { load, has, toggle, list, recent, sub: f => subs.add(f) };
})();

/* ───── удалённые: общий список с сайта + то, что я только что убрала или вернула на этом устройстве ───── */
const Del = (() => {
  let srv = new Set(), want = {};              // want[имя] = [1 убрать | 0 вернуть, когда]
  function calc() {
    srv = new Set((G.del || []).filter(P));
    want = LS.json("mk2.want", null);
    if (!want || typeof want !== "object") {     // перенос из прежней версии
      want = {}; const t = Date.now();
      for (const n of LS.json("mk.ldel", [])) want[n] = [1, t];
      for (const n of LS.json("mk.lund", [])) want[n] = [0, t];
    }
    const t = Date.now();
    for (const n of Object.keys(want)) { const w = want[n]; if (!P(n) || (srv.has(n) === !!w[0] && t - w[1] > 3e5)) delete want[n]; }   // сайт уже согласен — помнить незачем
    save(); const h = new Set(srv);
    for (const n of Object.keys(want)) { if (want[n][0]) h.add(n); else h.delete(n); }
    M.hidden = h;
  }
  const save = () => LS.put("mk2.want", want);
  function set(ns, hide) { const t = Date.now(); for (const n of ns) { want[n] = [hide ? 1 : 0, t]; if (hide) M.hidden.add(n); else M.hidden.delete(n); } save(); }
  /* что сайт ещё не записал */
  function unsynced() { const d = [], u = []; for (const n of Object.keys(want)) { if (want[n][0] && !srv.has(n)) d.push(n); else if (!want[n][0] && srv.has(n)) u.push(n); } return { del: d, und: u }; }
  return { calc, set, unsynced };
})();

/* ───── тайная планета ───── */
const Secret = {
  open() { if (LS.get("mk2.secret") === "1" || LS.get("doch.prize") === "1") return true; const a = LS.json("unitka.abStars", []); return Array.isArray(a) && a.length >= 5 && a.slice(0, 5).every(v => +v > 0); },
  unlock() { LS.set("mk2.secret", "1"); }
};

/* ───── «в этот день»: фото, снятые в этот же день много лет назад; нет таких — в эти дни; нет и их — в этом месяце ───── */
function memories() {
  const now = new Date(), yr = now.getFullYear(), byMD = new Map(), byMo = new Map();
  const md = d => (d.getMonth() + 1) * 100 + d.getDate();
  for (const n of M.order) {
    if (!visible(n)) continue; const p = P(n); if (!p || !p.d || M.albumOf.get(n) === "secret") continue;
    const d = parseD(p.d); if (d.getFullYear() >= yr) continue;
    if (p.ap === 0) { const k = md(d) * 10000 + d.getFullYear(); if (!byMD.has(k)) byMD.set(k, []); byMD.get(k).push(n); }
    const km = d.getMonth() * 10000 + d.getFullYear(); if (!byMo.has(km)) byMo.set(km, []); byMo.get(km).push(n);
  }
  const take = (date, kind) => { const out = []; for (const [k, ns] of byMD) if (Math.floor(k / 10000) === md(date)) { const y = k % 10000, when = new Date(y, date.getMonth(), date.getDate()); out.push({ kind, y, ago: yr - y, when, names: ns }); } return out; };
  let res = take(now, "day");
  if (!res.length) for (const off of [-1, 1, -2, 2, -3, 3, -4, 4]) { res = take(new Date(now.getFullYear(), now.getMonth(), now.getDate() + off), "near"); if (res.length) break; }
  if (!res.length) {
    const r = rng(dayNo());
    for (const [k, ns] of byMo) if (Math.floor(k / 10000) === now.getMonth()) { const y = k % 10000; res.push({ kind: "month", y, ago: yr - y, when: new Date(y, now.getMonth(), Math.min(now.getDate(), 28)), names: ns.length > 14 ? shuffle(ns, r).slice(0, 14).sort((a, b) => M.pos.get(a) - M.pos.get(b)) : ns }); }
  }
  return res.sort((a, b) => b.names.length - a.names.length).slice(0, 2).sort((a, b) => a.y - b.y);
}

/* ══════ 50_ui.js ══════ */
/* Каркас: экраны, «слои» поверх (альбом, просмотр, листы) с кнопкой «назад» телефона, листы снизу, подсказки. */
const app = $("#app");
const showScreen = name => { app.dataset.screen = name; };

/* Слой = всё, что закрывается кнопкой «назад»: альбом, просмотр фото, фильм, игра, лист. Закрывает всегда история браузера. */
const Layer = (() => {
  const st = []; let busy = false, after = null;
  function init() { try { history.replaceState({ mk: 0 }, ""); } catch (e) {} }
  function push(type, close) { st.push({ type, close }); try { history.pushState({ mk: st.length }, ""); } catch (e) {} }
  function pop(then) {
    if (!st.length) { if (then) then(); return; }
    if (busy) return; busy = true; after = then || null;
    setTimeout(() => { if (busy) drop(st.length - 1); }, 700);      // на случай, если браузер не сообщил о шаге назад
    try { history.back(); } catch (e) { drop(st.length - 1); }
  }
  function drop(depth) {
    busy = false;
    while (st.length > depth) { const l = st.pop(); try { l.close(); } catch (e) { console.error(e); } }
    if (after) { const f = after; after = null; f(); }
  }
  addEventListener("popstate", e => drop(Math.max(0, (e.state && e.state.mk) || 0)));
  return { init, push, pop, top: () => (st.length ? st[st.length - 1].type : null), has: t => st.some(l => l.type === t), depth: () => st.length };
})();
D.addEventListener("keydown", e => { if (e.key === "Escape" && Layer.depth()) { e.preventDefault(); Layer.pop(); } });

/* лист снизу */
function sheet(html, onClose) {
  const s = el("div", "sheet", `<div class="sheet-bg"></div><div class="sheet-box" role="dialog" aria-modal="true">${html}</div>`);
  let closed = false;
  const close = () => { if (closed) return; closed = true; s.classList.remove("on"); setTimeout(() => s.remove(), 500); if (onClose) onClose(); };
  $$(".toast").forEach(t => t.remove());                 // подсказка не должна лежать поверх кнопок листа
  $("#sheets").append(s); Layer.push("sheet", close);
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add("on")));
  s.addEventListener("click", e => { if (e.target.classList.contains("sheet-bg") || e.target.closest("[data-close]")) Layer.pop(); });

/* ══════ 90_admin.js ══════ */
/* Режим редактирования (код знает папа): убрать лишние фото и вернуть обратно.
   Убранное сразу пропадает на этом устройстве, а сайт шлёт зашифрованную кодом записку через ntfy.sh/<тема из списка альбомов>;
   домашний сервер (worker.py) проверяет код и записывает общий список data/del.bin — тогда фото пропадает у всех.
   Протокол прежний: base64( iv + AES-GCM(ключ из кода, {"del":[…],"und":[…],"t":…}) ), не больше 150 имён в записке. */

    const u = Del.unsynced();                           // записки могли не дойти (сервер молчал дольше, чем их хранит ntfy) — раз в полчаса повторяю
    if ((u.del.length || u.und.length) && !ops.length && Date.now() - (+LS.get("mk2.resent", 0) || 0) > 18e5) { queue(u.del, u.und); LS.set("mk2.resent", String(Date.now())); }

  function queue(del, und) {

    saveOps(); flush();

      pollN = 0; clearTimeout(pollT); pollT = setTimeout(poll, 75000);
    } catch (e) { setTimeout(flush, 30000); }
    sending = false;
  }
  /* сверяюсь с сайтом, пока он не согласится с тем, что я убрала и вернула */
  async function poll() {
    const d = await fetchDel(KEY);
    if (d) { const was = [...M.hidden].sort().join(); G.del = d; Del.calc(); if ([...M.hidden].sort().join() !== was) repaint(); }
    const u = Del.unsynced(); if (key && (u.del.length || u.und.length) && ++pollN < 12) { clearTimeout(pollT); pollT = setTimeout(poll, 60000); }
  }
  function repaint() { Home.refresh(); if (!Viewer.isOpen()) Album.render(); }
  addEventListener("online", flush);

  /* убрать фото: спросить → спрятать → записка серверу; обещание говорит, убрали или нет */
  async function remove(ns) {
    ns = ns.filter(visible); if (!ns.length || !key) return false;
    const k = ns.length, ok = await confirmSheet({ title: `Убрать ${tF(k)}?`, text: (k === 1 ? "Оно пропадёт" : "Они пропадут") + " с сайта у всех. Вернуть можно в настройках, в «Удалённых фото».", ok: "Убрать" });
    if (!ok) return false;
    Del.set(ns, true); queue(ns, []); Album.drop(ns); Home.refresh();
    toast(`Убрано: ${tF(k)}`, "Вернуть", () => restore(ns, true));
    return true;
  }
  async function restore(ns, quiet) {
    ns = ns.filter(n => M.hidden.has(n)); if (!ns.length || !key) return;
    if (!quiet && !(await confirmSheet({ title: `Вернуть ${tF(ns.length)}?`, text: (ns.length === 1 ? "Оно снова появится" : "Они снова появятся") + " на сайте у всех.", ok: "Вернуть" }))) return;
    Del.set(ns, false); queue([], ns); Home.refresh(); Album.render();
    toast(`Возвращено: ${tF(ns.length)}`);
  }
  return { on, boot, login, logout, remove, restore, pending: () => { const u = Del.unsynced(); return u.del.length + u.und.length; } };
})();

    const sh = sheet(
      `<h2 class="sh-t">Настройки</h2>
       <p class="set-h">Моё небо</p>
       <div class="themes">${THEMES.map(t => `<button type="button" data-th="${t[0]}" aria-pressed="${Sky.current() === t[0]}"><i></i>${t[1]}</button>`).join("")}</div>
       <p class="set-h">Музыка</p>
       <div class="rows"><button type="button" role="switch" id="setMus" aria-checked="${Music.on()}">${ico("note")}<span>Музыка космоса</span><i class="sw"></i></button></div>
       <div class="tracks">${TRACKS.map((t, k) => `<button type="button" data-tr="${k}" aria-pressed="${Music.index() === k}" aria-label="Мелодия ${k + 1}">${k + 1}</button>`).join("")}</div>
       <p class="set-h">Ещё</p>
       <div class="rows">
         ${mine ? `<button type="button" id="setAva">${ico("photo")}<span>Вернуть прежнее главное фото<small>сейчас на главной то, что выбрала я</small></span></button>` : ""}
         ${adm ? `<button type="button" id="setTrash">${ico("trash")}<span>Удалённые фото${pend ? `<small>ждут записи на сайт: ${pend}</small>` : ""}</span><em>${trash}</em></button>` : ""}
         <button type="button" id="setAdm">${ico("edit")}<span>${adm ? "Выйти из режима редактирования" : "Режим редактирования"}<small>${adm ? "кнопка «Выбрать» в альбомах пропадёт" : "убрать лишние фото — нужен код"}</small></span></button>
         <button type="button" id="setOut">${ico("exit")}<span>Выйти<small>здесь снова спросят кодовое слово</small></span></button>
       </div>
       <p class="set-foot">Мой космос · сборка ${BUILD}</p>`);
    const box = sh.box;
    $(".themes", box).onclick = e => { const b = e.target.closest("[data-th]"); if (!b) return; Sky.theme(b.dataset.th, true); $$("[data-th]", box).forEach(x => x.setAttribute("aria-pressed", x === b)); buzz(6); };
    const paint = () => { $("#setMus", box).setAttribute("aria-checked", Music.on()); $$("[data-tr]", box).forEach(x => x.setAttribute("aria-pressed", +x.dataset.tr === Music.index())); };
    $("#setMus", box).onclick = () => { Music.toggle(); paint(); };
    $(".tracks", box).onclick = e => { const b = e.target.closest("[data-tr]"); if (!b) return; Music.track(+b.dataset.tr); setTimeout(paint, 30); setTimeout(paint, 700); };
    if (mine) $("#setAva", box).onclick = () => { LS.del("mk2.ava"); Home.ava(); sh.close(() => toast("На главной снова прежнее фото")); };
    if (adm) $("#setTrash", box).onclick = () => sh.close(() => Album.open("trash"));
    $("#setAdm", box).onclick = () => { if (Admin.on()) { Admin.logout(); sh.close(() => toast("Режим редактирования выключен")); } else sh.close(askCode); };
    $("#setOut", box).onclick = () => sh.close(async () => {
      if (!(await confirmSheet({ title: "Выйти?", text: "Фото и любимые никуда не денутся. При следующем входе нужно будет кодовое слово.", ok: "Выйти" }))) return;
      LS.del("doch.k"); LS.del("doch.ks"); LS.del("mk.adm"); location.reload();
    });
  }
  function askCode() {
    const sh = sheet(`<h2 class="sh-t">Режим редактирования</h2><p class="sh-p">После входа в альбомах появится кнопка «Выбрать», а в просмотре — корзина: лишние фото можно убрать. Код запомнится на этом устройстве.</p>
      <form class="sh-form" autocomplete="off"><label class="fld"><span class="sr">Код редактирования</span><input type="password" name="kod2" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="код редактирования" enterkeyhint="go"></label><p class="sh-err" hidden></p><button class="btn gold wide" type="submit">Войти</button></form>`);
    const f = $("form", sh.box), inp = $("input", f), er = $(".sh-err", f);
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 520);
    f.onsubmit = async e => {
      e.preventDefault(); if (!normPw(inp.value)) return; er.hidden = true; $(".btn", f).disabled = true;
      try { await Admin.login(inp.value); inp.blur(); sh.close(() => { Album.paintAdmin(); Admin.boot(); toast("Готово. В альбомах появилась кнопка «Выбрать»"); }); }
      catch (x) { er.textContent = x && x.message === "no" ? "Обнови страницу — и попробуй ещё раз" : "Код не подошёл"; er.hidden = false; }
      $(".btn", f).disabled = false;
    };
  }
  return { open };
})();

/* ══════ 99_boot.js ══════ */
/* Вход. Кодовое слово → ключ → расшифровка списка альбомов. Вход запоминается на устройстве (сам ключ, не слово);
   пока космос открывается, пароль не спрашиваем; нет связи — «попробовать снова», запомненный вход при этом не стирается. */
(() => {
  const f = $("#gateF"), w = $("#gateW"), err = $("#gateE"), inp = $("#gateP");
  const form = msg => { w.hidden = true; f.hidden = false; err.hidden = !msg; if (msg) err.textContent = msg; };
  const waiting = (text, retry) => { f.hidden = true; w.hidden = false; $("#gateWT").textContent = text; $("#gateRetry").hidden = !retry; $(".loader", w).hidden = !!retry; };
  async function enter() {
    buildModel(); Home.init();
    if (!RM) { warp(); await wait(160); }
    showScreen("home"); Admin.boot();
  }
  async function boot() {
    Layer.init(); Sky.init(); Sky.theme(Sky.current(), false);
    if ("serviceWorker" in navigator && (!LOCAL || /[?&]sw=1/.test(location.search))) navigator.serviceWorker.register("sw.js").catch(() => {});
    if (!window.crypto || !crypto.subtle) return form("Этот браузер не умеет открывать альбомы. Открой сайт в Safari или Chrome.");
    const saved = LS.get("doch.k", "");
    if (saved) waiting("Открываю мой космос…");
    try { LOCK = await fetchLock(); } catch (e) { return saved ? waiting("Нет связи. Проверь интернет.", true) : form("Нет связи. Проверь интернет и попробуй ещё раз."); }
    if (saved && LS.get("doch.ks", "") === LOCK.salt) {
      for (let a = 0; a < 3; a++) {
        try { await openWith(await importKey(saved)); return enter(); }
        catch (e) {
          if (e instanceof NetErr) { if (a === 2) return waiting("Нет связи. Проверь интернет.", true); await wait(1400); continue; }
          LS.del("doch.k"); break;                    // кодовое слово на сайте сменили — спросим заново
        }
      }
    }
    form();
  }
  f.addEventListener("submit", async e => {
    e.preventDefault(); const v = inp.value; if (!normPw(v) || f.classList.contains("busy")) return;
    err.hidden = true; f.classList.add("busy"); $("#gateGo").textContent = "Открываю…";
    try {
      if (!LOCK) LOCK = await fetchLock();
      const key = await deriveKey(v, LOCK.salt, LOCK.iter); await openWith(key);
      if ($("#gateR").checked) { LS.set("doch.k", await exportKey(key)); LS.set("doch.ks", LOCK.salt); }
      inp.blur(); inp.value = ""; await enter();
    } catch (x) {
      err.textContent = x instanceof NetErr ? "Не загрузилось. Проверь интернет." : "Не то слово. Попробуй ещё раз."; err.hidden = false;
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); buzz(30);
    }
    f.classList.remove("busy"); $("#gateGo").textContent = "Войти";
  });
  $("#gateEye").onclick = () => { const show = inp.type === "password"; inp.type = show ? "text" : "password"; $("#gateEye").innerHTML = ico(show ? "eyeoff" : "eye"); $("#gateEye").setAttribute("aria-label", show ? "Скрыть кодовое слово" : "Показать кодовое слово"); };
  $("#gateRetry").onclick = () => location.reload();
  boot();
})();

})();
