<!-- «Моя планета» — кубический 3D-мир сайта «Мой космос». Сборка 20261112-0934. Вход — тот же, что на основной странице:
     ключ лежит в памяти устройства; нет ключа — сразу на основную страницу, там вводится кодовое слово. -->
<script>try{if(!localStorage.getItem("doch.k"))location.replace("./")}catch(e){location.replace("./")}</script>
<style>
/* «Моя планета» — оформление поверх 3D-мира: заставка, кнопки управления, подписи, альбом, просмотр фото, меню.
   Краски те же, что у «Моего космоса»: ночное небо, сиреневый, розовый, тёплое золото. Шрифт — круглый системный. */
:root{color-scheme:dark;
  --bg0:#06051a;--bg1:#110b33;--bg2:#1f1250;--glass:rgba(14,10,44,.66);--panel:#15103c;
  --vio:138,108,255;--pink:255,122,196;--blue:78,150,255;
  --gold:#f3dcae;--gold2:#ffd76a;--ink:#f7f3ff;--ink2:#cdc7ea;--ink3:#958ebf;--heart:#ff7fb5;
  --line:rgba(243,220,174,.24);--line2:rgba(243,220,174,.5);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--bg0);overscroll-behavior:none;position:fixed;inset:0}
body{color:var(--ink);font:600 16px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
svg.i{width:1em;height:1em;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg0)}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}

/* ───────── заставка ───────── */
#load{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 90% at 50% 20%,#2a1a6b 0%,#110b33 46%,#06051a 100%);transition:opacity .7s ease,visibility 0s linear .7s}
#load.off{opacity:0;visibility:hidden;pointer-events:none}
#load::before{content:"";position:absolute;inset:0;opacity:.7;
  background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff,transparent 60%),radial-gradient(1.2px 1.2px at 78% 14%,#fff,transparent 60%),radial-gradient(1.6px 1.6px at 64% 68%,#fff,transparent 60%),
    radial-gradient(1px 1px at 30% 80%,#fff,transparent 60%),radial-gradient(1.3px 1.3px at 88% 52%,#fff,transparent 60%),radial-gradient(1px 1px at 46% 36%,#fff,transparent 60%),
    radial-gradient(1.2px 1.2px at 8% 60%,#fff,transparent 60%),radial-gradient(1px 1px at 55% 8%,#fff,transparent 60%),radial-gradient(1.4px 1.4px at 22% 46%,#fff,transparent 60%),radial-gradient(1px 1px at 94% 86%,#fff,transparent 60%)}
.load-in{position:relative;padding:24px;max-width:420px}
.load-cube{width:86px;height:86px;margin:0 auto 26px;border-radius:14px;position:relative;
  background:linear-gradient(135deg,#fff6d8,#f3dcae 52%,#d7b06a);box-shadow:0 0 0 6px rgba(243,220,174,.12),0 0 60px 12px rgba(243,220,174,.45),inset -10px -12px 0 rgba(120,80,20,.16);
  animation:cubeFloat 3.6s ease-in-out infinite}
.load-cube::before,.load-cube::after{content:"";position:absolute;border-radius:5px;background:rgba(150,110,50,.28)}
.load-cube::before{width:20px;height:20px;left:16px;top:18px}
.load-cube::after{width:13px;height:13px;right:18px;bottom:20px}
@keyframes cubeFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(5deg)}}
#load h1{font-size:34px;font-weight:800;letter-spacing:.01em;color:var(--gold);text-shadow:0 2px 24px rgba(243,220,174,.45)}
#load p{margin-top:8px;color:var(--ink2);font-size:15px;min-height:21px}
.load-bar{width:190px;height:8px;margin:20px auto 0;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.load-bar i{display:block;height:100%;width:6%;border-radius:6px;background:linear-gradient(90deg,rgb(var(--vio)),rgb(var(--pink)),var(--gold2));transition:width .5s var(--ease)}
#loadR{margin-top:22px}

/* ───────── кнопки общие ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:26px;font-weight:800;font-size:16px;
  color:#2b1c06;background:linear-gradient(180deg,#ffe9b0,#f1c765);box-shadow:0 4px 0 #b98a2e,0 10px 26px rgba(241,199,101,.3);transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b98a2e,0 4px 12px rgba(241,199,101,.3)}
.btn.vio{color:#fff;background:linear-gradient(180deg,#a68cff,#7b5cf0);box-shadow:0 4px 0 #4b33b3,0 10px 26px rgba(123,92,240,.35)}
.btn.vio:active{box-shadow:0 1px 0 #4b33b3}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:active{transform:scale(.97)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:20px}

/* ───────── верхняя строка ───────── */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px)}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:7px;height:44px;padding:0 14px 0 11px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line);font-size:17px;font-weight:800}
.chip svg{font-size:22px;color:var(--gold2);filter:drop-shadow(0 0 6px rgba(255,215,106,.7))}
.chip i{font-style:normal;color:var(--ink3);font-weight:700;font-size:14px;margin-left:-3px}
.chip.pop{animation:chipPop .5s var(--ease)}
@keyframes chipPop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
#hRun{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;height:auto;min-height:44px;padding:5px 14px;line-height:1.15}
#hRun b{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
#hRun span{font-size:18px;font-variant-numeric:tabular-nums;font-weight:800}
#hRun small{font-size:10.5px;color:var(--ink3);font-weight:700}
.hud-r{margin-left:auto;display:flex;gap:8px}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line);font-size:22px;color:var(--ink)}
.rbtn:active{transform:scale(.92)}
.rbtn.gold{color:var(--gold2)}

/* ───────── название при прилёте ───────── */
#title{position:fixed;left:0;right:0;top:22%;z-index:4;text-align:center;pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1.4s var(--ease)}
#title.on{opacity:1;transform:none}
#title h1{font-size:clamp(34px,10vmin,72px);font-weight:800;color:var(--gold);letter-spacing:.01em;text-shadow:0 3px 30px rgba(6,5,26,.9),0 0 46px rgba(243,220,174,.5)}
#title p{margin-top:6px;font-size:clamp(14px,3.6vmin,20px);color:var(--ink);text-shadow:0 2px 12px rgba(6,5,26,.95)}
#skip{position:fixed;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 18px);z-index:6}

/* ───────── управление пальцами ───────── */
#pad{position:fixed;inset:0;z-index:3;pointer-events:none}
#joy{position:absolute;left:calc(var(--sal) + 26px);bottom:calc(var(--sab) + 34px);width:124px;height:124px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07),rgba(255,255,255,.03) 62%,rgba(255,255,255,.1) 64%,rgba(255,255,255,.04));box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);opacity:.75;transition:opacity .2s}
#joy.on{opacity:1}
#joyK{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9cfff 55%,#a391f5);box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 2px rgba(255,255,255,.5);will-change:transform}
#bJump{position:absolute;right:calc(var(--sar) + 26px);bottom:calc(var(--sab) + 44px);width:92px;height:92px;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;font-size:40px;color:#3a2400;
  background:radial-gradient(circle at 35% 28%,#fff6cf,#ffd76a 56%,#f1b436);box-shadow:0 6px 0 #b0801c,0 12px 26px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.55);transition:transform .08s ease,box-shadow .08s ease}
#bJump.on{transform:translateY(5px);box-shadow:0 1px 0 #b0801c,0 4px 10px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.55)}
@media (orientation:landscape) and (max-height:520px){
  #joy{width:112px;height:112px;left:calc(var(--sal) + 30px);bottom:calc(var(--sab) + 22px)}
  #bJump{width:84px;height:84px;right:calc(var(--sar) + 34px);bottom:calc(var(--sab) + 26px)}
}

/* ───────── подсказка-кнопка у предмета, сообщения ───────── */
#prompt{position:fixed;left:50%;bottom:calc(var(--sab) + 176px);z-index:6;transform:translateX(-50%);max-width:min(88vw,420px);min-height:50px;padding:0 22px;border-radius:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:800;font-size:16px;color:#2b1c06;background:linear-gradient(180deg,#ffe9b0,#f1c765);box-shadow:0 4px 0 #b98a2e,0 10px 30px rgba(0,0,0,.45);animation:promptIn .28s var(--ease)}
#prompt:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #b98a2e}
@keyframes promptIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
@media (orientation:landscape) and (max-height:520px){#prompt{bottom:calc(var(--sab) + 20px)}}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 66px);z-index:7;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,460px)}
#toast div{padding:10px 18px;border-radius:20px;background:rgba(14,10,44,.86);box-shadow:inset 0 0 0 1.5px var(--line),0 8px 24px rgba(0,0,0,.4);font-size:15px;font-weight:700;text-align:center;animation:toastIn .35s var(--ease)}
#toast div.out{opacity:0;transform:translateY(-8px);transition:opacity .35s ease,transform .35s ease}
#toast div b{color:var(--gold2)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
#hint{position:fixed;left:50%;bottom:calc(var(--sab) + 250px);z-index:4;transform:translateX(-50%);width:min(90vw,440px);padding:12px 18px;border-radius:18px;background:rgba(14,10,44,.8);box-shadow:inset 0 0 0 1.5px var(--line);
  font-size:14.5px;font-weight:700;text-align:center;color:var(--ink);pointer-events:none;transition:opacity .5s ease}
#hint.out{opacity:0}
@media (orientation:landscape) and (max-height:520px){#hint{bottom:auto;top:calc(var(--sat) + 62px)}}
#banner{position:fixed;left:0;right:0;top:27%;z-index:4;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .4s ease,transform .6s var(--ease)}
#banner.on{opacity:1;transform:none}
#banner b{display:block;font-size:clamp(26px,7.5vmin,50px);font-weight:800;color:#fff;text-shadow:0 3px 22px rgba(6,5,26,.9),0 0 34px rgba(var(--vio),.9)}
#banner span{display:block;margin-top:2px;font-size:clamp(14px,3.8vmin,20px);color:var(--gold);text-shadow:0 2px 12px rgba(6,5,26,.95)}
#fade{position:fixed;inset:0;z-index:8;background:#0b0828;opacity:0;pointer-events:none;transition:opacity .16s ease}
#fade.on{opacity:1}
#fade.white{background:#fff}

/* ───────── окна поверх мира ───────── */
.ov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column}
.ov.pop{animation:ovIn .32s var(--ease)}
@keyframes ovIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* аффирмация на весь экран */
#aff{align-items:center;justify-content:center;text-align:center;padding:calc(var(--sat) + 24px) 26px calc(var(--sab) + 24px);cursor:pointer;
  background:radial-gradient(90% 70% at 50% 42%,rgba(var(--vio),.62),rgba(31,18,80,.92) 55%,rgba(6,5,26,.97) 100%)}
#aff .ray{position:absolute;left:50%;top:42%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,215,106,.16) 0deg 6deg,transparent 6deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 46%);mask-image:radial-gradient(circle,#000 0,transparent 46%);animation:raySpin 40s linear infinite}
@keyframes raySpin{to{transform:rotate(360deg)}}
#aff .st{position:relative;font-size:76px;color:var(--gold2);filter:drop-shadow(0 0 22px rgba(255,215,106,.9));animation:stPop .7s var(--ease)}
@keyframes stPop{0%{transform:scale(0) rotate(-140deg)}70%{transform:scale(1.18) rotate(8deg)}100%{transform:none}}
#affT{position:relative;margin-top:14px;max-width:16em;font-size:clamp(27px,7.6vmin,56px);font-weight:800;line-height:1.16;text-wrap:balance;text-shadow:0 2px 26px rgba(6,5,26,.7)}
#affT span{display:inline-block;opacity:0;transform:translateY(16px);animation:wordIn .6s var(--ease) forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
#affN{position:relative;margin-top:18px;font-size:15px;color:var(--gold);font-weight:800;letter-spacing:.04em}
#affK{position:relative;margin-top:28px;font-size:13.5px;color:var(--ink3);font-weight:700;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* альбом */
#album{background:linear-gradient(180deg,#0b0828,#150f3d 60%,#1a1150)}
.alb-h{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 12px) 10px calc(var(--sal) + 12px);border-bottom:1px solid var(--line);background:rgba(11,8,40,.9)}
.alb-h .tt{flex:1;min-width:0}
.alb-h h2{font-size:21px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-h p{font-size:13px;color:var(--ink3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:4px calc(var(--sar) + 10px) calc(var(--sab) + 30px) calc(var(--sal) + 10px)}
.alb-day{margin:16px 4px 8px;font-size:14px;font-weight:800;color:var(--ink2);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.alb-day small{font-size:12.5px;color:var(--ink3);font-weight:700}
.alb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:6px}
@media (min-width:700px){.alb-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}}
.tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,rgba(var(--vio),.28),rgba(var(--pink),.16));cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
.tile img.on{opacity:1}
.tile:active{transform:scale(.96)}
.tile .hrt{position:absolute;right:6px;bottom:6px;font-size:17px;color:var(--heart);filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
.alb-empty{padding:60px 20px;text-align:center;color:var(--ink3)}

/* просмотр фото */
#viewer{z-index:40;background:#03020d;touch-action:none}
#vStage{position:absolute;inset:0;overflow:hidden}
.vimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.vimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vimg img.big{opacity:0;transition:opacity .3s ease}
.vimg img.big.on{opacity:1}
.v-top{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 26px calc(var(--sal) + 10px);background:linear-gradient(180deg,rgba(3,2,13,.78),transparent);transition:opacity .25s ease}
.v-top .n{flex:1;text-align:center;font-size:14px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.v-bot{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 18px calc(var(--sab) + 16px);text-align:center;background:linear-gradient(0deg,rgba(3,2,13,.82),transparent);transition:opacity .25s ease;pointer-events:none}
.v-bot b{display:block;font-size:17px;font-weight:800;color:var(--gold)}
.v-bot span{display:block;font-size:13.5px;color:var(--ink2);font-weight:700;margin-top:1px}
#viewer.bare .v-top,#viewer.bare .v-bot{opacity:0;pointer-events:none}
.v-nav{position:absolute;top:50%;z-index:2;width:48px;height:48px;margin-top:-24px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:rgba(14,10,44,.6);box-shadow:inset 0 0 0 1.5px var(--line)}
.v-nav.p{left:12px}.v-nav.nx{right:12px}
@media (hover:none){.v-nav{display:none}}
#vHeart.on{color:var(--heart)}
#vHeart.on svg{fill:currentColor}

/* меню */
#menu{align-items:center;justify-content:flex-end;background:rgba(6,5,26,.72)}
.sheet{width:min(100%,560px);max-height:92%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:linear-gradient(180deg,#1b1450,#120c38);box-shadow:0 -10px 50px rgba(0,0,0,.55),inset 0 0 0 1.5px var(--line);overflow:hidden}
@media (min-width:600px) and (min-height:560px){#menu{justify-content:center}.sheet{border-radius:26px}}
.sheet-h{flex:none;display:flex;align-items:center;gap:10px;padding:14px 14px 10px 20px}
.sheet-h h2{flex:1;font-size:21px;font-weight:800;color:var(--gold)}
.tabs{flex:none;display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 15px;border-radius:19px;font-size:14px;font-weight:800;color:var(--ink2);background:rgba(255,255,255,.07)}
.tabs button.on{color:#2b1c06;background:linear-gradient(180deg,#ffe9b0,#f1c765)}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:4px 16px calc(var(--sab) + 20px)}
.s-list{display:grid;gap:7px}
.s-it{display:flex;gap:11px;align-items:center;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.06);font-size:15px;font-weight:700;text-align:left;width:100%}
.s-it .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--gold2);background:rgba(255,215,106,.14)}
.s-it.no{color:var(--ink3);font-weight:600}
.s-it.no .k{color:var(--ink3);background:rgba(255,255,255,.06);font-size:13px;font-weight:800}
.s-it small{display:block;font-size:12px;color:var(--ink3);font-weight:700}

/* ══════ 00_base.js ══════ */
/* «Моя планета» — кубический 3D-мир сайта «Мой космос». Свой оригинальный мир: остров из кубиков под большой луной,
   аллея воспоминаний с фото, звёзды с аффирмациями, башня до Луны и сундук с сюрпризом.
   Эта часть: библиотека 3D, мелкие помощники, память устройства. */
import * as THREE from "./assets/mir/three.module.min.js";

const D = document, W = window;
const $ = (s, r = D) => r.querySelector(s);
const $$ = (s, r = D) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e = D.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const ico = (id, cls) => `<svg class="i${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));      // плавно догонять: не зависит от частоты кадров
const smooth = t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const BUILD = "20261112-0934";
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

/* память устройства: не падает в приватном режиме и при переполнении */
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  json(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  put(k, v) { this.set(k, JSON.stringify(v)); }
};
const DEV = LOCAL || LS.get("mir.dev") === "1";                          // проверочные команды: только на этом компьютере или по особой метке
const TOUCH = matchMedia("(pointer: coarse)").matches || "ontouchstart" in W;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* случайности, которые повторяются: мир каждый раз один и тот же */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise2(x, z, seed) {                                              // мягкий шум 0..1 для холмов и края острова
  const xi = Math.floor(x), zi = Math.floor(z), fx = smooth(x - xi), fz = smooth(z - zi);
  const a = hash3(xi, seed, zi), b = hash3(xi + 1, seed, zi), c = hash3(xi, seed, zi + 1), d = hash3(xi + 1, seed, zi + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
}
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* русские слова и даты (как на основной странице) */
const nf = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const pl = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const tY = y => y + " " + pl(y, "год", "года", "лет");
const tM = m => m + " " + pl(m, "месяц", "месяца", "месяцев");
const tD = d => d + " " + pl(d, "день", "дня", "дней");
const tF = n => nf(n) + " фото";
const MON = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
const MONG = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const parseD = s => { const a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2] || 1); };
const dayNo = () => { const n = new Date(); return Math.floor((n.getTime() - n.getTimezoneOffset() * 6e4) / 864e5); };
const fmtTime = ms => { const s = ms / 1000, m = Math.floor(s / 60); return m + ":" + (s - m * 60 < 10 ? "0" : "") + (s - m * 60).toFixed(1); };

/* сообщения между частями */
const Bus = (() => {
  const m = new Map();
  return { on(n, f) { if (!m.has(n)) m.set(n, []); m.get(n).push(f); }, emit(n, a) { const l = m.get(n); if (l) for (const f of l) f(a); } };
})();

/* успехи: всё хранится на этом устройстве */
const Save = (() => {
  const def = () => ({ v: 1, stars: [], flag: 0, best: {}, chest: 0, crown: 0, seen: {}, opt: {}, look: {}, own: [], pet: "", gift: {}, runs: 0 });
  let d = LS.json("mir.save", null);
  d = d && typeof d === "object" && d.v === 1 ? Object.assign(def(), d) : def();
  for (const k of ["stars", "own"]) if (!Array.isArray(d[k])) d[k] = [];
  for (const k of ["best", "seen", "opt", "look", "gift"]) if (!d[k] || typeof d[k] !== "object") d[k] = {};
  let t = 0;
  const now = () => { clearTimeout(t); t = 0; LS.put("mir.save", d); };

  return { d, put() { if (!t) t = setTimeout(now, 300); }, now };
})();

/* ══════ 05_data.js ══════ */
/* Данные. Вход — тем же ключом, что на основной странице (он лежит в памяти устройства после ввода кодового слова).
   Всё про фото на сайте зашифровано AES-256-GCM: файл = 12 байт iv + шифротекст. Формат общий с основной страницей:
   lock.json, data/m.bin (список альбомов), data/del.bin (скрытые фото), data/t|f/<имя>.bin (малое и большое фото).
   Кодового слова и кодов в этой странице нет и быть не должно. */
const PHOTO_BASE = LOCAL ? "data/" : "https://raw.githubusercontent.com/asty7us-web/moy-kosmos/main/data/";
let KEY = null, LOCK = null, G = null;

class NetErr extends Error {}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function getBin(url, opt) {
  let r;
  try { r = await fetch(url, opt); } catch (e) { throw new NetErr("net"); }
  if (!r.ok) { const e = new NetErr("http" + r.status); e.status = r.status; throw e; }
  try { return await r.arrayBuffer(); } catch (e) { throw new NetErr("net"); }
}
async function aesDec(buf) { const b = new Uint8Array(buf); return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.subarray(0, 12) }, KEY, b.subarray(12)); }
const decJson = async buf => JSON.parse(new TextDecoder().decode(await aesDec(buf)));
async function fetchLock() {
  for (let a = 0; a < 3; a++) {
    try { const r = await fetch("lock.json?v=" + Date.now(), { cache: "no-store" }); if (r.ok) return await r.json(); } catch (e) {}
    await wait(900);
  }
  throw new NetErr("net");
}
/* открыть данные сохранённым ключом: "ok" или "nokey" (нужно войти на основной странице); нет связи — ошибка NetErr */
async function openData() {
  const raw = LS.get("doch.k", "");
  if (!raw || !W.crypto || !crypto.subtle) return "nokey";
  LOCK = await fetchLock();
  if (LS.get("doch.ks", "") !== LOCK.salt) return "nokey";
  try { KEY = await crypto.subtle.importKey("raw", b64d(raw), "AES-GCM", false, ["decrypt"]); } catch (e) { return "nokey"; }
  try { if (new TextDecoder().decode(await aesDec(b64d(LOCK.chk))) !== "kosmos-ok") return "nokey"; } catch (e) { return "nokey"; }
  G = await decJson(await getBin("data/m.bin?v=" + encodeURIComponent(LOCK.b || "0")));
  try { G.del = (await decJson(await getBin("data/del.bin?v=" + Date.now(), { cache: "no-store" }))).del || []; } catch (e) { G.del = []; }
  buildModel();

/* ───── фото: скачать, расшифровать, отдать адрес картинки в памяти ───── */
const Ph = (() => {
  const urls = new Map(), big = [], BIG_MAX = 8;       // больших держим немного: память телефона не резиновая
  function one(k) {
    const u = PHOTO_BASE + k + ".bin";
    // не расшифровалось — файл на сайте заменили, а в памяти телефона старый: берём свежий
    return getBin(u).then(b => aesDec(b)).catch(e => { if (e instanceof NetErr) throw e; return getBin(u + "?fresh=1", { cache: "reload" }).then(b => aesDec(b)); })
      .then(b => URL.createObjectURL(new Blob([b], { type: "image/jpeg" })));
  }
  function get(n, isBig) {
    const k = (isBig ? "f/" : "t/") + n; let p = urls.get(k);
    if (!p) { p = one(k); urls.set(k, p); p.catch(() => { if (urls.get(k) === p) urls.delete(k); }); }
    if (isBig) {
      const i = big.indexOf(k); if (i >= 0) big.splice(i, 1); big.push(k);
      while (big.length > BIG_MAX) { const old = big.shift(), op = urls.get(old); urls.delete(old); if (op) op.then(u => setTimeout(() => URL.revokeObjectURL(u), 4000)).catch(() => {}); }
    }
    return p;
  }
  /* картинка, готовая стать текстурой или показаться сразу */
  function image(n, isBig) {
    return get(n, isBig).then(u => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error("img")); im.src = u; }));
  }
  return { get, image };
})();

/* ───── модель: месяцы жизни считаются по календарю от дня рождения — «мне 3 месяца» начинается ровно 9-го числа ───── */
const M = { months: [], now: null, secret: null, hidden: new Set() };
let BIRTH = new Date(2014, 1, 9);
const P = n => G.ph[n];
function ageAt(date) {
  let y = date.getFullYear() - BIRTH.getFullYear(), m = date.getMonth() - BIRTH.getMonth(), d = date.getDate() - BIRTH.getDate();
  if (d < 0) { m--; d += new Date(date.getFullYear(), date.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const days = Math.round((new Date(date.getFullYear(), date.getMonth(), date.getDate()) - BIRTH) / 864e5);
  return { y, m, d, days };
}
function monthTitle(m, short) {             // m — сколько полных месяцев: «Мне 3 месяца» / «3 месяца»
  if (m <= 0) return short ? "Первый месяц" : "Мой первый месяц";
  const y = Math.floor(m / 12), r = m % 12;
  const s = y === 0 ? tM(r) : m === 12 ? "годик" : tY(y) + (r ? " " + tM(r) : "");
  return short ? cap(s) : "Мне " + s;
}
function ageText(date) {                     // точный возраст в день съёмки
  const a = ageAt(date);
  if (a.days <= 0) return "день, когда я родилась";
  if (a.y === 0 && a.m === 0) return "мне " + tD(a.days);
  if (a.y === 0) return "мне " + tM(a.m) + (a.d ? " и " + tD(a.d) : "");
  return "мне " + (a.y === 1 && !a.m ? "годик" : tY(a.y) + (a.m ? " " + tM(a.m) : "")) + (a.d ? " и " + tD(a.d) : "");
}
const monthIdx = p => { const a = ageAt(parseD(p.d)); return Math.max(0, a.y * 12 + a.m); };
const addMonths = (d, k) => new Date(d.getFullYear(), d.getMonth() + k, d.getDate());
function periodOf(m) {                       // «9 мая – 8 июня 2014»
  const s = addMonths(BIRTH, m), e = new Date(addMonths(BIRTH, m + 1) - 864e5);
  return `${s.getDate()} ${MONG[s.getMonth()]}${s.getFullYear() !== e.getFullYear() ? " " + s.getFullYear() : ""} – ${e.getDate()} ${MONG[e.getMonth()]} ${e.getFullYear()}`;
}

function buildModel() {
  BIRTH = parseD(G.birth || "2014-02-09");
  const byM = new Map();
  for (const s of G.sections || []) if (/^m\d+$/.test(s.id)) for (const n of s.p) { const p = P(n); if (p && p.d) { const m = monthIdx(p); if (!byM.has(m)) byM.set(m, []); byM.get(m).push(n); } }
  M.months = [...byM.keys()].sort((a, b) => a - b).map(m => ({ id: "m" + m, kind: "month", m, all: byM.get(m), title: monthTitle(m), short: monthTitle(m, true) }));
  const now = (G.sections || []).find(s => s.id === "now");
  M.now = { id: "now", kind: "now", all: now ? now.p.filter(P) : [], title: "Я сейчас", short: "Сейчас" };
  M.secret = { id: "secret", kind: "secret", all: (G.surprise || []).filter(P), title: "Мы с Ульяной", short: "Тайный альбом" };
  /* скрытые фото: общий список с сайта + то, что только что убрали или вернули на этом устройстве (только читаю) */
  const h = new Set((G.del || []).filter(P));
  let want = LS.json("mk2.want", null);
  if (!want || typeof want !== "object") {
    want = {};
    const a = LS.json("mk.ldel", []), b = LS.json("mk.lund", []);
    if (Array.isArray(a)) for (const n of a) want[n] = [1, 0];
    if (Array.isArray(b)) for (const n of b) want[n] = [0, 0];
  }
  for (const n of Object.keys(want)) { const w = want[n]; if (!Array.isArray(w)) continue; if (w[0]) h.add(n); else h.delete(n); }
  M.hidden = h;
}
const listOf = a => a.all.filter(n => !M.hidden.has(n));

/* остановки аллеи: по одной на месяц и «Сейчас». Если фото добавят и месяцев станет больше мест — соседние месяцы делят один портал */
function alleyStops(maxMonths) {
  const ms = M.months.filter(a => listOf(a).length), out = [], per = Math.max(1, Math.ceil(ms.length / maxMonths));
  for (let i = 0; i < ms.length; i += per) {
    const part = ms.slice(i, i + per), a = part[0], z = part[part.length - 1];
    out.push(part.length === 1 ? { id: a.id, title: a.title, short: a.short, sub: periodOf(a.m), parts: part }
      : { id: a.id + "_" + z.id, title: a.short + " — " + z.short.toLowerCase(), short: a.short + " — " + z.short.toLowerCase(), sub: "", parts: part });
  }
  if (listOf(M.now).length) out.push({ id: "now", title: "Я сейчас", short: "Сейчас", sub: "фото последних лет", parts: [M.now] });
  return out;
}
/* обложка: подходящее вертикальное фото из середины (как на основной странице) */
function coverOf(list) {
  if (!list.length) return null;
  const exact = list.filter(n => P(n).ap === 0 && P(n).h >= P(n).w), tall = list.filter(n => P(n).h >= P(n).w), pool = exact.length ? exact : tall.length ? tall : list;
  return pool[Math.floor(pool.length * .4)];
}
/* подпись к фото: { t: «Мне 3 месяца», s: «8 мая 2014, 14:35» } */
function photoWhen(n, album) {
  const p = P(n);
  if (!p || !p.d) return album && album.kind === "secret" ? { t: "Мы с Ульяной", s: "тайный альбом" } : { t: "Я сейчас", s: "фото последних лет" };
  const d = parseD(p.d), t = monthTitle(monthIdx(p));
  if (p.ap === 0) return { t, s: `${d.getDate()} ${MONG[d.getMonth()]} ${d.getFullYear()}` + (p.tm ? ", " + p.tm : "") };
  return { t, s: (p.ap === 1 ? "≈ " : "") + MON[d.getMonth()] + " " + d.getFullYear() };
}
/* группы внутри месяца: сначала точные дни по порядку, потом фото, у которых известен только месяц */
function groupsOf(album) {
  const list = listOf(album);
  if (album.kind !== "month") return list.length ? [{ key: album.id, items: list }] : [];
  const days = [], loose = new Map();
  for (const n of list) {
    const p = P(n);
    if (p.ap === 0) { const k = p.d + (p.al || ""); let g = days[days.length - 1]; if (!g || g.key !== k) days.push(g = { key: k, date: parseD(p.d), tag: p.al || "", items: [] }); g.items.push(n); }
    else { const k = p.d.slice(0, 7) + (p.ap === 1 ? "~" : ""); if (!loose.has(k)) loose.set(k, { key: k, month: parseD(p.d.slice(0, 7) + "-01"), approx: p.ap === 1, items: [] }); loose.get(k).items.push(n); }
  }
  return [...days, ...[...loose.values()].sort((x, y) => x.month - y.month || (x.approx ? 1 : -1))];
}

/* ───── любимые: только то, что отметила сама; общий список с основной страницей (память устройства) ───── */
const Fav = (() => {
  let arr = [];
  function load() {
    let a = LS.json("mk2.fav", null);
    if (!Array.isArray(a)) { const old = LS.json("doch.fav2", {}); a = old && Array.isArray(old.add) ? old.add : []; }   // сердечки прежней версии

  const list = () => load().filter(n => G && P(n) && !M.hidden.has(n));
  return { load, has, toggle, list };
})();

/* ══════ 10_audio.js ══════ */
/* Звук. Все звуки игры рисуются кодом (WebAudio) — файлов нет. Музыка — те же космические мелодии, что на основной странице,
   идут потоком и тихо. Браузер разрешает звук только после первого касания — тогда всё и включается. */
const Snd = (() => {
  let ctx = null, master = null, mus = null, au = null, musOn = false, noiseBuf = null;
  const opt = Save.d.opt;
  if (opt.sfx == null) opt.sfx = 1;
  if (opt.music == null) opt.music = LS.get("mk2.music", LS.get("spMute", "0") === "1" ? "0" : "1") === "1" ? 1 : 0;   // выбор «без музыки» с основной страницы уважаем
  const TRACKS = ["assets/space-music.mp3", "assets/space-music-2.mp3", "assets/space-music-3.mp3", "assets/space-music-4.mp3"];
  let ti = (parseInt(LS.get("mk2.track", "0"), 10) || 0) % TRACKS.length;

  function ensure() {
    if (ctx) return true;
    const AC = W.AudioContext || W.webkitAudioContext; if (!AC) return false;

    try {
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
      const n = ctx.sampleRate; noiseBuf = ctx.createBuffer(1, n, n); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;

  /* один тон: частота (можно скользить к f2), длительность, форма, громкость, задержка */

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.att || .005)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random() * .5); src.stop(t + dur + .03);
  }
  const bell = (f, at, vol = .2, dur = .7) => { tone(f, dur, { at, vol, type: "sine" }); tone(f * 2.01, dur * .6, { at, vol: vol * .35, type: "triangle" }); };
  const N = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, D6: 1174.66, E6: 1318.5, G6: 1568, C7: 2093 };
  const S = {
    jump() { tone(330, .16, { to: 660, type: "triangle", vol: .16 }); },
    land() { noise(.12, { f: 420, vol: .16 }); },
    step() { noise(.04, { f: 1600, vol: .035, type: "bandpass", q: 2 }); },
    star() { [N.E5, N.G5, N.C6, N.E6, N.G6].forEach((f, i) => bell(f, i * .075, .19)); },
    flag() { bell(N.C5, 0, .2, .4); bell(N.E5, .11, .2, .4); bell(N.G5, .22, .2, .4); bell(N.C6, .33, .24, .9); },
    boing() { tone(190, .34, { to: 620, type: "sine", vol: .26 }); tone(380, .22, { to: 900, type: "triangle", vol: .1, at: .03 }); },
    fall() { tone(700, .5, { to: 130, type: "sine", vol: .16 }); },
    lava() { noise(.5, { f: 2600, to: 300, vol: .22, type: "bandpass", q: 1.2 }); tone(240, .35, { to: 80, type: "sawtooth", vol: .08 }); },
    bonk() { tone(160, .16, { to: 70, type: "square", vol: .16 }); noise(.1, { f: 700, vol: .18 }); },
    click() { tone(880, .05, { type: "triangle", vol: .1 }); },
    open() { noise(.5, { f: 300, to: 3000, vol: .12, type: "bandpass", q: 1.4 }); bell(N.G5, .05, .12, .5); bell(N.C6, .16, .14, .7); },

    lift() { tone(260, .25, { to: 390, type: "triangle", vol: .08 }); },
    gift() { [N.C5, N.E5, N.G5, N.C6, N.E6, N.C7].forEach((f, i) => bell(f, i * .09, .18)); },
    record() { [N.G5, N.C6, N.E6, N.G6, N.C7].forEach((f, i) => bell(f, i * .08, .2)); },
    boom(at = 0) { noise(.9, { at, f: 1800, to: 120, vol: .3 }); tone(90, .5, { at, to: 40, vol: .3 }); for (let i = 0; i < 6; i++) noise(.05, { at: at + .25 + Math.random() * .6, f: 5000, vol: .08, type: "highpass" }); },

        au.src = TRACKS[ti];

  function setSfx(v) { opt.sfx = v ? 1 : 0; Save.put(); if (v) { kick(); play("click"); } }
  /* вкладку спрятали — тишина; вернулись — играем дальше */
  function hidden(h) {

    else { ctx.resume().catch(() => {}); if (au && musOn && opt.music) { const p = au.play(); if (p && p.catch) p.catch(() => {}); } }
  }
  return { play, setMusic, setSfx, hidden, get music() { return !!opt.music; }, get sfx() { return !!opt.sfx; } };
})();

/* ══════ 20_engine.js ══════ */
/* Движок: холст, сцена, камера, главный цикл. Игра считается ровными шагами (120 раз в секунду) — прыжки одинаковые
   на любом телефоне. Вкладку спрятали или открыто окно поверх мира — цикл стоит и батарею не тратит.
   Если телефон не успевает, картинка сама становится чуть мельче (и обратно, когда успевает). */
const canvas = $("#gl");
const LOW = (navigator.hardwareConcurrency || 4) <= 4 && (navigator.deviceMemory || 4) <= 3;      // слабое устройство: без сглаживания, меньше мелочей
let renderer = null;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.15, 1500);
scene.add(camera);
const STEP = 1 / 120;
const SIM = [], VIS = [];                                    // что делать на каждом шаге игры и на каждом кадре
const Loop = { t: 0, last: 0, acc: 0, raf: 0, frames: 0, paused: new Set(), on: false };
const View = { w: 1, h: 1, pr: 1, prMax: 1, scale: 1, lock: false, portrait: true, proj: 1 };

function makeRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: "high-performance", stencil: false, alpha: false });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x06051a, 1);
  View.prMax = Math.min(W.devicePixelRatio || 1, LOW ? 1.5 : 2);
  canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); pause("gl"); });
  canvas.addEventListener("webglcontextrestored", () => resume("gl"));
  resize();
  addEventListener("resize", resize);
  if (W.visualViewport) W.visualViewport.addEventListener("resize", resize);
  addEventListener("orientationchange", () => setTimeout(resize, 250));
}
function resize() {
  const w = Math.max(1, W.innerWidth), h = Math.max(1, W.innerHeight);
  View.w = w; View.h = h; View.portrait = h >= w; View.pr = Math.max(.5, View.prMax * View.scale);
  renderer.setPixelRatio(View.pr); renderer.setSize(w, h, false);
  const a = w / h; camera.aspect = a; camera.fov = clamp(58 + (1.2 - a) * 20, 58, 76); camera.updateProjectionMatrix();
  View.proj = h * View.pr / (2 * Math.tan(camera.fov * Math.PI / 360));      // сколько точек экрана занимает 1 блок на расстоянии 1
  Bus.emit("resize");
  if (!Loop.on || Loop.paused.size) renderOnce();
}
function renderOnce() { if (renderer && Loop.frames) renderer.render(scene, camera); }

/* подстройка чёткости под скорость телефона */
const Perf = (() => {
  let sum = 0, n = 0, hold = 0, ups = 0, fps = 60, before = 0, prev = 1;
  function tick(dt) {

/* ══════ 50_ui.js ══════ */
/* Надписи и окна поверх мира: сообщения, подсказки, затемнение, кнопка «у предмета», меню с вкладками.
   Пока открыто окно — мир стоит на паузе, управление человечком молчит. */
const UI = (() => {
  const toastBox = $("#toast"), fadeEl = $("#fade"), hintEl = $("#hint"), stack = [];
  let banT = 0, hintT = 0;
  function toast(html, ms = 2800) {
    const d = el("div", "", html); toastBox.append(d); while (toastBox.children.length > 3) toastBox.firstChild.remove();
    setTimeout(() => { d.classList.add("out"); setTimeout(() => d.remove(), 400); }, ms);
  }
  function banner(b, s, ms = 2400) { $("#banB").textContent = b; $("#banS").textContent = s || ""; $("#banner").classList.add("on"); clearTimeout(banT); banT = setTimeout(() => $("#banner").classList.remove("on"), ms); }
  function hint(html, ms = 7000) { hintEl.innerHTML = html; hintEl.hidden = false; hintEl.classList.remove("out"); clearTimeout(hintT); hintT = setTimeout(() => { hintEl.classList.add("out"); setTimeout(() => { hintEl.hidden = true; }, 520); }, ms); }
  function hintOff() { clearTimeout(hintT); hintEl.hidden = true; }
  function fade(on, white) { fadeEl.classList.toggle("white", !!white); fadeEl.classList.toggle("on", !!on); }
  function open(id) {

    o.hidden = false; o.classList.remove("pop"); void o.offsetWidth; o.classList.add("pop");
    stack.push(id); Input.modal(true); pause("ui:" + id); hintOff();
  }
  function close(id) {

    o.hidden = true; const i = stack.lastIndexOf(id); if (i >= 0) stack.splice(i, 1); Input.modal(false); resume("ui:" + id);
  }
  const top = () => stack[stack.length - 1] || "";
  return { toast, banner, hint, hintOff, fade, open, close, top };
})();

/* места, у которых появляется кнопка-подсказка («Лифт», «Сундук», «Подарок»): ближайшее в радиусе */
const Spots = (() => {

/* ══════ 55_alley.js ══════ */
/* Аллея воспоминаний: порталы вокруг острова, в каждом — фото месяца. Вбежала в портал — открылся альбом этого месяца.
   Порядок по кругу: справа от дороги к башне — «первый месяц», дальше по часовой стрелке, слева от дороги — «сейчас». */

  const portals = []; let cool = 0, queue = [], active = 0;
  /* какие места заняты: месяцы — по порядку, «сейчас» — всегда на последнем месте */
  function plan() {
    const stops = alleyStops(SLOTS.length - 1), now = stops.length && stops[stops.length - 1].id === "now" ? stops.pop() : null;
    stops.slice(0, SLOTS.length - 1).forEach((st, n) => { SLOTS[n].stop = st; });
    if (now) SLOTS[SLOTS.length - 1].stop = now;
  }
  const count = st => st.parts.reduce((a, p) => a + listOf(p).length, 0);
  function signTex(text, colorCss) {
    return canvasTex(512, 96, (g) => {
      const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

      g.fillStyle = "#2c1d5a"; g.textAlign = "center"; g.textBaseline = "middle"; let fs = 52; g.font = `800 ${fs}px ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif`;
      while (g.measureText(text).width > 460 && fs > 24) { fs -= 3; g.font = `800 ${fs}px ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif`; }
      g.fillText(text, 256, 50);
    }, { aniso: 4 });
  }
  function build() {
    const ph0 = canvasTex(96, 128, (g, w, h) => { const q = g.createLinearGradient(0, 0, w, h); q.addColorStop(0, "#3a2a86"); q.addColorStop(1, "#7a3f9a"); g.fillStyle = q; g.fillRect(0, 0, w, h); g.fillStyle = "rgba(255,230,160,.85)"; g.font = "56px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("✦", w / 2, h / 2); });
    SLOTS.forEach((s, n) => {
      if (!s.stop) return;
      const st = s.stop, list = [].concat(...st.parts.map(listOf)), cover = coverOf(list);
      const mat = new THREE.MeshBasicMaterial({ map: ph0 }), mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 4), mat);
      mesh.position.set(s.photo[0], s.photo[1], s.photo[2]); mesh.rotation.y = s.ry; scene.add(mesh);
      const c = BT[PF[n]].side, sign = new THREE.Mesh(new THREE.PlaneGeometry(4.5, .85), new THREE.MeshBasicMaterial({ map: signTex(st.short, "#" + c.getHexString(THREE.SRGBColorSpace)), transparent: true }));
      sign.position.set(s.photo[0] + s.dir[0] * 1.03, 4.5, s.photo[2] + s.dir[1] * 1.03); sign.rotation.y = s.ry; scene.add(sign);

  }

  function loadCovers() {
    queue = portals.filter(p => p.cover && !p.loaded).sort((a, b) => Math.hypot(a.s.stand[0] - PL.x, a.s.stand[2] - PL.z) - Math.hypot(b.s.stand[0] - PL.x, b.s.stand[2] - PL.z));

      const s = p.s; placePlayer(s.stand[0], 0, s.stand[2], Math.atan2(s.dir[0], s.dir[1])); Cam.yaw = Math.atan2(-s.dir[0], -s.dir[1]); camSnap(); cool = .8;

    if (cool > 0) { cool -= dt; return; }

})();

/* ══════ 56_album.js ══════ */
/* Альбом месяца (сетка фото) и просмотр на весь экран — прямо на этой странице, поверх мира.
   Миниатюры расшифровываются по мере прокрутки, не больше шести сразу. Сердечко — общий список любимых с основной страницей. */

  const body = $("#albB"); let order = [], onClose = null, obs = null, pend = [], active = 0, curStop = null;
  const info = new WeakMap();

      w.go = 1; active++;
      Ph.get(w.n, false).then(u => { im.src = u; const done = () => im.classList.add("on"); if (im.decode) im.decode().then(done, done); else im.onload = done; obs.unobserve(im); }, () => { w.go = 0; })

    body.innerHTML = ""; let total = 0;
    for (const part of stop.parts) {
      const groups = groupsOf(part);
      if (stop.parts.length > 1 && groups.length) body.append(el("div", "alb-day", `<span style="color:var(--gold);font-size:17px">${esc(part.title)}</span>`));
      for (const g of groups) {
        if (part.kind === "month") {
          let h;
          if (g.date) h = `${g.date.getDate()} ${MONG[g.date.getMonth()]} ${g.date.getFullYear()}<small>${esc(ageText(g.date))}${g.tag ? " · " + esc(g.tag) : ""}</small>`;
          else h = `${g.approx ? "≈ " : ""}${MON[g.month.getMonth()]} ${g.month.getFullYear()}<small>точный день неизвестен</small>`;

  return { open, close };

/* подарок дня: раз в календарный день — аффирмация дня и вещица для гардероба (пока они не кончатся) */

    setTimeout(() => { placePlayer(x, y, z, yaw); if (yaw != null) Cam.yaw = yaw + Math.PI; camSnap(); UI.fade(false); Snd.play("lift"); if (after) after(); }, 200);
  }
  function home() { const s = WORLD.spawn; jump(s.x, s.y, s.z, s.yaw, () => Tower.leave()); }
  function optMenu(box) {
    const row = (icon, text, on, f) => { const r = el("button", "row" + (on ? " on" : ""), `${ico(icon)}<span>${text}</span><i class="sw"></i>`); r.type = "button"; r.onclick = () => { const v = !r.classList.contains("on"); r.classList.toggle("on", v); f(v); }; box.append(r); };
    row("sound", "Звуки", Snd.sfx, v => Snd.setSfx(v));
    row("note", "Музыка", Snd.music, v => Snd.setMusic(v));
    const b = el("button", "row", `${ico("rocket")}<span>Вернуться в Мой космос</span>`); b.type = "button"; b.onclick = () => { Save.now(); location.href = "./"; }; box.append(b);
    const h = el("button", "row", `${ico("home")}<span>На площадь</span>`); h.type = "button"; h.onclick = () => { Menu.close(); home(); }; box.append(h);
    box.append(el("div", "note", TOUCH ? "Слева — джойстик, справа — прыжок. Води пальцем по экрану, чтобы смотреть вокруг; двумя пальцами — ближе и дальше." : "Ходить — WASD или стрелки, прыжок — пробел, осмотреться — мышь с зажатой кнопкой, колёсико — ближе и дальше, E — действие."));
    box.append(el("div", "note", "Все успехи хранятся на этом устройстве."));
  }
  function start() {
    const first = !Save.d.runs; Save.d.runs = (Save.d.runs || 0) + 1; Save.put();
    PL.frozen = true; Ctl.on = false;
    $("#load").classList.add("off"); $("#title").classList.add("on"); $("#skip").hidden = false;
    Cam.onIntroEnd = () => {
      Bus.emit("intro-end"); PL.frozen = false; Ctl.on = true; $("#title").classList.remove("on"); $("#skip").hidden = true; $("#hud").hidden = false; Input.showPad(); Alley.loadCovers();
      if (first) UI.hint(TOUCH ? "Слева — <b>джойстик</b>, справа — <b>прыжок</b>.<br>Води пальцем по экрану — смотри вокруг." : "Ходить — <b>WASD</b> или стрелки, прыжок — <b>пробел</b>.<br>Осмотреться — мышь с зажатой кнопкой.", 9000);
      else UI.toast("С возвращением на твою планету!");
    };
    introStart(!first); startLoop();
  }
  function step(dt) { Alley.step(dt); Stars.step(dt); Tower.step(dt); }
  function vis(dt) {
    Tower.vis(dt); Stars.vis(dt); Chest.vis(dt); Town.vis(dt); Pet.vis(dt);
    for (const l of labels) { const d = camera.position.distanceTo(l.sp.position); l.sp.material.opacity = clamp((d - 15) / 9, 0, 1) * clamp((120 - d) / 40, 0, 1); l.sp.visible = l.sp.material.opacity > .01 && Cam.mode !== "intro"; }
  }
  return { build, start, step, vis, home, jump, label };
})();

/* ══════ 90_boot.js ══════ */
/* Запуск: вход, сборка мира, прилёт. */
let READY = false;
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
function loadMsg(p, t) { $("#loadB").style.width = p + "%"; if (t) $("#loadT").textContent = t; }
function loadFail(t, retry) { $("#loadT").textContent = t; $(".load-bar").hidden = true; const b = $("#loadR"); b.hidden = false; b.textContent = retry ? "Попробовать снова" : "В Мой космос"; b.onclick = () => { if (retry) location.reload(); else location.href = "./"; }; }

async function boot() {
  try { makeRenderer(); } catch (e) { loadFail("Этот браузер не умеет показывать 3D-мир. Попробуй открыть в другом."); return; }
  loadMsg(14, "Открываю альбомы…");
  let st;
  try { st = await openData(); } catch (e) { loadFail(e instanceof NetErr ? "Нет связи — проверь интернет" : "Не получилось открыть мир", true); return; }
  if (st !== "ok") { location.replace("./"); return; }           // ключа нет или он устарел — вход на основной странице
  loadMsg(42, "Строю остров из кубиков…"); await nextFrame(); await nextFrame();
  makeMaterials(); Alley.plan(); genIsland(); genExtras();
  Tower.build(); Isles.build();
  if (typeof Town !== "undefined") Town.build();
  loadMsg(64, "Зажигаю луну и звёзды…"); await nextFrame();
  buildSky(); buildWorldMesh();
  Alley.build(); Stars.build(); Chest.build(); Game.build();
  if (typeof Town !== "undefined") Town.after();
  buildDecor(); buildLampGlows(); FX.init(); initAvatar();
  loadMsg(92, "Почти прилетели…"); await nextFrame();
  SIM.push(dynStep, playerStep, Game.step);
  VIS.push(camVis, Spots.pick, Game.vis);
  const sp = WORLD.spawn; placePlayer(sp.x, sp.y, sp.z, sp.yaw); PL.safe = { x: sp.x, y: sp.y, z: sp.z, yaw: sp.yaw };
  Game.start();
  READY = true;
}
boot().catch(e => { console.error(e); loadFail("Что-то пошло не так — попробуй ещё раз", true); });

/* ══════ 95_dev.js ══════ */
/* Проверочные команды (только на этом компьютере или по особой метке в памяти устройства): телепорт, быстрый прогон игры
   без отрисовки, сведения о мире. Нужны, чтобы проверять мир скриптом. */
if (DEV) {
  W.__mir = {
    get ready() { return READY; },
    PL, Cam, Ctl, Save, View, Loop, WORLD, Dyn, THREE, scene, camera, vget, B, BT,
    info() { const r = renderer.info.render; return { x: +PL.x.toFixed(2), y: +PL.y.toFixed(2), z: +PL.z.toFixed(2), g: PL.grounded, mode: Cam.mode, fps: Math.round(Perf.fps), calls: r.calls, tris: r.triangles, scale: View.scale, t: +Loop.t.toFixed(2), stars: Save.d.stars.length, flag: Save.d.flag, worldTris: WORLD.tris, frozen: PL.frozen, paused: [...Loop.paused] }; },
    tp(x, y, z, yaw) { placePlayer(x, y, z, yaw); camSnap(); },
    look(yaw, pitch, dist) { Cam.yaw = yaw; if (pitch != null) Cam.pitch = pitch; if (dist != null) { Cam.dist = dist; Cam.userZoom = true; } Cam.manualT = Loop.t + 1e6; camSnap(); },
    skip() { if (Cam.mode === "intro") { Cam.it = 1; } },
    /* прогнать игру вперёд без отрисовки */
    sim(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) { for (let q = 0; q < SIM.length; q++) SIM[q](STEP); Loop.t += STEP; } },
    lock(scale) { View.lock = true; View.scale = scale || 1; resize(); },
    render() { for (let i = 0; i < VIS.length; i++) VIS[i](1 / 60); renderer.render(scene, camera); }
  };

  /* ───── проверочный бот: проходит этаж башни по записанному пути ───── */
  const Bot = { k: 0, wi: 0, go: false, t: 0, lastJ: -9, deaths: 0, done: false, reset: false };
  const supportAt = (x, y, z) => {
    const t = vget(Math.floor(x), Math.floor(y - .3), Math.floor(z)); if (t && !IS_LAVA[t]) return true;
    for (const b of Dyn.list) if (b.solid && x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1 && b.y1 <= y + .15 && b.y1 >= y - .45) return true;
    return false;
  };
  function botStep(dt) {
    Bot.t += dt; Ctl.wx = Ctl.wz = 0;
    const wp = Tower.ways[Bot.k], C = Tower.C;
    if (Tower.run.on && Tower.run.flag >= Bot.k) { Bot.done = true; return; }
    if (Bot.reset) { Bot.reset = false; Bot.deaths++; Bot.wi = Tower.run.mid ? Tower.run.mid.wi : 0; Bot.go = false; }
    const w = wp[Bot.wi] || { x: C.x - 2.6, y: Bot.k * 10, z: C.z, last: true }, prev = wp[Bot.wi - 1];
    const tx = w.dyn ? (w.dyn.x0 + w.dyn.x1) / 2 : w.x, tz = w.dyn ? (w.dyn.z0 + w.dyn.z1) / 2 : w.z, ty = w.dyn ? w.dyn.y1 : w.y;
    const dx = tx - PL.x, dz = tz - PL.z, d = Math.hypot(dx, dz), nx = dx / (d || 1), nz = dz / (d || 1);
    const arrived = w.air ? (!PL.grounded && PL.vy > 6 && PL.y > w.y + .5 && d < 1.6) : (d < (w.r || .45) && PL.grounded && Math.abs(PL.y - ty) < .6 && (!w.dyn || PL.gd === w.dyn));
    if (arrived && !w.last) { Bot.wi++; Bot.go = false; return; }
    if (w.wait && !Bot.go) { if (!PL.grounded) { /* летим — рулим как обычно */ } else if (w.wait()) Bot.go = true; else return; }
    const m = clamp(d / .9, 0, 1), br = clamp(1 - d / 1.4, 0, 1) * .7;
    Ctl.wx = nx * m - PL.vx / RUN * br; Ctl.wz = nz * m - PL.vz / RUN * br;
    if (PL.grounded) {
      let jump = false; const ahead = supportAt(PL.x + nx * .55, PL.y, PL.z + nz * .55), higher = ty > PL.y + .3;
      if (!ahead && d > .9) jump = true;
      Bot.slow = m > .5 && Math.hypot(PL.vx, PL.vz) < .6 ? (Bot.slow || 0) + dt : 0;           // упёрлись в ступеньку и стоим — подпрыгнуть
      if (higher && Bot.slow > .3 && d > .4 && Bot.t - Bot.lastJ > .5) jump = true;
      const sw = w.sweep || (prev && prev.sweep);
      if (sw) {                                                  // крутилка: прыгаем, когда перекладина вот-вот дойдёт
        const px = PL.x - sw.cx, pz = PL.z - sw.cz, r = Math.hypot(px, pz);
        if (r < sw.r + .5) { const th = Math.atan2(pz, px), sg = Math.sign(sw.w); for (let n = 0; n < 2; n++) { let da = ((th - (sw.a + n * Math.PI)) * sg) % TAU; if (da < 0) da += TAU; const tt = da / Math.abs(sw.w); if (tt < .2 || (r < .9 && tt < .3)) jump = true; } }
      }
      if (jump && Bot.t - Bot.lastJ > .12) { Ctl.jumpTap = true; Bot.lastJ = Bot.t; }
    }
  }
  Bus.on("respawn", () => { if (Ctl.bot) Bot.reset = true; });
  Object.assign(W.__mir, {
    Tower, Stars, Chest, Alley, Bot, Album, Viewer, Menu, Spots, Fav, M, Town, Ward, Pet, Gifts, LOOK, buildAvatar,
    /* пройти этаж k ботом без отрисовки: вернуть, получилось ли, время и число падений */
    botRun(k, maxSec = 150) {
      const f = Tower.flags[k - 1]; Tower.leave(); placePlayer(f.spawn.x, f.spawn.y, f.spawn.z, f.spawn.yaw);
      Object.assign(Bot, { k, wi: 0, go: false, t: 0, lastJ: -9, deaths: 0, done: false, reset: false }); Ctl.bot = botStep; Ctl.on = true; PL.frozen = false;
      const n = Math.round(maxSec / STEP); let i = 0;
      for (; i < n && !Bot.done; i++) { for (let q = 0; q < SIM.length; q++) SIM[q](STEP); Loop.t += STEP; }
      Ctl.bot = null; Ctl.wx = Ctl.wz = 0;
      return { k, done: Bot.done, sec: +Bot.t.toFixed(1), deaths: Bot.deaths, wi: Bot.wi, of: Tower.ways[k].length, pos: [+PL.x.toFixed(1), +PL.y.toFixed(1), +PL.z.toFixed(1)], best: Save.d.best[k] || null, flag: Tower.run.flag };
    },
    /* какие звёзды достижимы пешком и прыжками от места появления (башню проверяет бот) */
    reach() {
      const ok = (i, j, k) => { const t = vget(i, j - 1, k); return t && !IS_LAVA[t] && !vget(i, j, k) && !vget(i, j + 1, k); };
      const key = (i, j, k) => i + "," + j + "," + k, seen = new Set(), q = [];
      const push = (i, j, k) => { const s = key(i, j, k); if (!seen.has(s) && ok(i, j, k)) { seen.add(s); q.push([i, j, k]); } };
      push(0, 0, 9);
      const lifts = [[27, -5, 27, 27, 0, 27]].concat(WORLD.teleports.map(t => [Math.floor(t.x), Math.round(groundTop(t.x, t.z, t.y + 1)), Math.floor(t.z), Math.floor(t.to.x), Math.round(groundTop(t.to.x, t.to.z, 6)), Math.floor(t.to.z)]));
      while (q.length) {
        const [i, j, k] = q.pop();
        for (let di = -4; di <= 4; di++) for (let dk = -4; dk <= 4; dk++) { if (!di && !dk) continue; const h = Math.hypot(di, dk);
          for (let dj = 1; dj >= -16; dj--) { if (dj === 1 ? h > 3.2 : dj === 0 ? h > 4.1 : h > 4.1 + Math.min(1.6, -dj * .3)) continue; if (dj === 1 && vget(i, j + 2, k)) continue; push(i + di, j + dj, k + dk); } }
        for (const l of lifts) if (Math.abs(i - l[0]) <= 2 && Math.abs(k - l[2]) <= 2 && Math.abs(j - l[1]) <= 1) for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) push(l[3] + a, l[4], l[5] + b);
      }
      const cells = [...seen].map(s => s.split(",").map(Number)), out = [];
      for (const s of Stars.list) {
        const inside = vget(Math.floor(s.x), Math.floor(s.y), Math.floor(s.z));
        let best = null; for (const c of cells) { const d = Math.hypot(s.x - c[0] - .5, s.z - c[2] - .5), dy = s.y - (c[1] + .8); if (d <= 1 && dy > -1.2 && dy < 2.7) { best = c; break; } }
        if (s.zone !== "tower" || s.id === "s27") out.push({ id: s.id, zone: s.zone, ok: !!best && !inside, inside: !!inside, at: [+s.x.toFixed(1), +s.y.toFixed(1), +s.z.toFixed(1)] });
        else if (inside) out.push({ id: s.id, zone: s.zone, ok: false, inside: true });
      }
      return { cells: cells.length, bad: out.filter(o => !o.ok), n: out.length };
    },
    botOn(k) { const f = Tower.flags[k - 1]; Tower.leave(); placePlayer(f.spawn.x, f.spawn.y, f.spawn.z, f.spawn.yaw); camSnap(); Object.assign(Bot, { k, wi: 0, go: false, t: 0, lastJ: -9, deaths: 0, done: false, reset: false }); Ctl.bot = botStep; }
  });
}
